ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - dev
            - test
            - staging
            - prod
        cli_version: v1.1.3-rc.4
        cli_version_sha: 824d2415a15bc39fa4a1940596a845806c9c4f4f
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
              retries: 2
            - name: docs
              workflow: .github/workflows/build-docs.yaml
              triggers: []
              optional_depends_on:
                - app
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
              supports_dry_run: true
              rollout:
                max_parallel: 2
                fail_fast: false
        extra_triggers:
            schedule:
                - cron: 0 7 * * *
            repository_dispatch:
                types:
                    - cascade-revalidate
            workflow_run:
                workflows:
                    - build-app
                types:
                    - completed
        validate_check:
            enabled: true
        merge_queue:
            enabled: true
        drift_check:
            enabled: true
            comment: true
        pin_mode: sha
        action_pins:
            actions/checkout: df4cb1c069e1874edd31b4311f1884172cec0e10
            actions/setup-go: 4a3601121dd01d1626a1e23e37211e3254c1c06c
    state:
