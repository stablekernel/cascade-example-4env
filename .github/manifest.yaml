ci:
    config:
        schema_version: 1
        trunk_branch: main
        triggers:
            - src/**
        environments:
            - dev
            - test
            - staging
            - prod
        cli_version: v0.14.0-dryrun.54
        cli_version_sha: 26ce47121f2ec304cb8db77aa43d1c9e799d13e5
        state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
        manifest_file: .github/manifest.yaml
        manifest_key: ci
        builds:
            - name: app
              workflow: .github/workflows/build-app.yaml
              triggers: []
              retries: 2
            - name: docs
              workflow: .github/workflows/build-docs.yaml
              triggers: []
              optional_depends_on:
                - app
        deploys:
            - name: app
              workflow: .github/workflows/deploy-app.yaml
              triggers: []
              supports_dry_run: true
              rollout:
                max_parallel: 2
                fail_fast: false
        extra_triggers:
            schedule:
                - cron: 0 7 * * *
            repository_dispatch:
                types:
                    - cascade-revalidate
            workflow_run:
                workflows:
                    - build-app
                types:
                    - completed
        validate_check:
            enabled: true
        merge_queue:
            enabled: true
        drift_check:
            enabled: true
            comment: true
        pin_mode: sha
        action_pins:
            actions/checkout: df4cb1c069e1874edd31b4311f1884172cec0e10
            actions/setup-go: 4a3601121dd01d1626a1e23e37211e3254c1c06c
    state:
        dev:
            sha: d4e16fc6fbd75bf89fae4203d394b0b9410a4907
            version: v1.0.0-rc.0
            committed_at: "2026-07-10T11:46:41Z"
            committed_by: joshua-temple
            deploys:
                app:
                    sha: d4e16fc6fbd75bf89fae4203d394b0b9410a4907
                    deployed_at: "2026-07-10T11:46:41Z"
                    deployed_by: joshua-temple
        prod: {}
        staging: {}
        test:
            sha: d4e16fc6fbd75bf89fae4203d394b0b9410a4907
