ci:
  config:
    schema_version: 1
    trunk_branch: main
    cli_version: v1.0.0-rc.11
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    environments: [dev, test, staging, prod]
    triggers: [src/**]
    pin_mode: sha
    action_pins:
      actions/checkout: df4cb1c069e1874edd31b4311f1884172cec0e10
      actions/setup-go: 4a3601121dd01d1626a1e23e37211e3254c1c06c
    extra_triggers:
      schedule:
        - cron: '0 7 * * *'
      repository_dispatch:
        types: [cascade-revalidate]
      workflow_run:
        workflows: [build-app]
        types: [completed]
      merge_group: {}
    merge_queue:
      enabled: true
    validate_check:
      enabled: true
    builds:
      - name: app
        workflow: .github/workflows/build-app.yaml
        triggers: []
      - name: docs
        workflow: .github/workflows/build-docs.yaml
        triggers: []
        optional_depends_on: [app]
    deploys:
      - name: app
        workflow: .github/workflows/deploy-app.yaml
        triggers: []
        supports_dry_run: true
        rollout:
          max_parallel: 2
          fail_fast: false
  state: {}
