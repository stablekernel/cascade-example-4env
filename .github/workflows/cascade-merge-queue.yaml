# AUTO-GENERATED by cascade - DO NOT EDIT MANUALLY
# Regenerate with: cascade generate-workflow --config .github/manifest.yaml
#
# Merge-queue validation lane (opt-in via merge_queue.enabled).
# Runs on merge_group against the would-be-trunk commit and validates it
# with cascade's own logic: a lint validity gate plus a dry-run
# orchestrate setup that previews the build/deploy decisions. The lane is
# read-only (no state writes, releases, or deploys) and reports a status
# the merge queue can require.

name: Merge Queue Validation

on:
  merge_group:

permissions:
  contents: read

jobs:
  merge-queue-validate:
    name: Merge Queue Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@25b365f7f4f16de174120c30cb060b35fa63accd # v0.16.4-rc.0
        with:
          version: v0.16.4-rc.0
          token: ${{ github.token }}
      - name: Validate Manifest
        run: |
          MANIFEST_FILE=".github/manifest.yaml"
          RESULT=$(cascade lint --json --config "$MANIFEST_FILE")
          echo "$RESULT"
          VALID=$(echo "$RESULT" | jq -r '.valid // false')
          if [[ "$VALID" != "true" ]]; then
            echo "$RESULT" | jq -r '.errors[]? | "::error::" + .'
            echo "::error::Manifest validation failed"
            exit 1
          fi
          echo "::notice::Manifest is valid"
      - name: Preview Orchestration (dry-run)
        run: |
          MANIFEST_FILE=".github/manifest.yaml"
          cascade --dry-run orchestrate setup \
            --config "$MANIFEST_FILE" \
            --environment dev
