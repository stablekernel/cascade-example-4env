# AUTO-GENERATED by cascade - DO NOT EDIT MANUALLY
# Regenerate with: cascade generate-workflow --config .github/manifest.yaml
#
# Manifest-validation PR check (opt-in via validate_check.enabled).
# Runs `cascade lint` against the manifest on pull_request and
# fails when the configuration is invalid, so a malformed manifest cannot
# merge. Validates cascade's own configuration only; it does not run the
# repository's build or test suites.

name: Validate Manifest

on:
  pull_request:
    paths:
      - .github/manifest.yaml

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@2231b2bee90615ffb66cdee3a3cfd410720df370 # v0.16.5-rc.2
        with:
          version: v0.16.5-rc.2
          token: ${{ github.token }}
      - name: Validate Manifest
        run: |
          MANIFEST_FILE=".github/manifest.yaml"
          if [[ ! -f "$MANIFEST_FILE" ]]; then
            echo "::error::$MANIFEST_FILE not found"
            exit 1
          fi
          # lint --json reports validity in its JSON output (valid: false on
          # parse or schema errors), so gate on the parsed result.
          RESULT=$(cascade lint --json --config "$MANIFEST_FILE")
          echo "$RESULT"
          VALID=$(echo "$RESULT" | jq -r '.valid // false')
          if [[ "$VALID" != "true" ]]; then
            echo "$RESULT" | jq -r '.errors[]? | "::error::" + .'
            echo "::error::Manifest validation failed"
            exit 1
          fi
          echo "::notice::Manifest is valid"
