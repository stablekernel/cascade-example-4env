# End-to-end validation driver for the cascade CLI in this example repo.
# Walks the four-environment stage table (dev, test, staging, prod), driving the
# generated orchestrate.yaml and promote.yaml workflows, then reads back manifest
# state, git tags, and GitHub releases after every step to assert the full snapshot.
# This is a product validation harness for the release pipeline.
name: scenario-suite

on:
  workflow_dispatch:
    inputs:
      cascade_version:
        description: 'cascade rc tag to self-repin to (e.g. v0.14.2-rc.0). Empty runs committed defaults.'
        required: false
        default: ''
      cascade_version_sha:
        description: 'Peeled commit SHA paired with cascade_version. Empty runs committed defaults.'
        required: false
        default: ''
  schedule:
    - cron: '0 9 * * *'
  repository_dispatch:
    types: [cascade-revalidate]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: scenario-suite
  cancel-in-progress: false

env:
  MANIFEST: .github/manifest.yaml
  MANIFEST_KEY: ci
  VERSION_RE: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  SHA_RE: '^[0-9a-f]{40}$'
  RC_RE: '\-rc\.[0-9]+'

jobs:
  open-window:
    name: Open reconcile window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      window-start: ${{ steps.window.outputs.window-start }}
    steps:
      # The reconcile window opens here, before the first dispatch or merge.
      # Every run the suite goes on to cause lands at or after this timestamp,
      # so the reconcile job sees all of them.
      - name: Open reconcile window
        id: window
        run: |
          set -euo pipefail
          WINDOW_START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "window-start=$WINDOW_START" >> "$GITHUB_OUTPUT"
          echo "reconcile window opened at $WINDOW_START"


  repin:
    name: Self-repin to dispatched rc
    needs: [open-window]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Log cascade version mode
        run: |
          if [ -n "${{ inputs.cascade_version }}" ]; then
            echo "Running against dispatched rc: ${{ inputs.cascade_version }} (sha ${{ inputs.cascade_version_sha }})"
          else
            echo "Running against committed defaults (no rc dispatched)"
          fi

      - name: Self-repin manifest to the dispatched rc
        uses: stablekernel/cascade/.github/actions/fleet-repin@main
        with:
          cascade_version: ${{ inputs.cascade_version }}
          cascade_version_sha: ${{ inputs.cascade_version_sha }}
          token: ${{ secrets.CASCADE_STATE_TOKEN }}


  lifecycle:
    name: Release lifecycle dev to prod
    needs: [repin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      # Source for the revalidation request, taken from the event payload via
      # env to avoid injecting payload text into shell scripts.
      REVALIDATE_SOURCE: ${{ github.event.client_payload.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.14.2
        with:
          version: ${{ inputs.cascade_version || 'v0.8.0' }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${REVALIDATE_SOURCE:-}" ]; then
            echo "Revalidation requested by: ${REVALIDATE_SOURCE}"
          fi

      # Shared helpers used by every assertion step. Sourced from $BASH_ENV so the
      # functions are available in later run blocks without re-declaring them.
      - name: Install assertion helpers
        run: |
          set -euo pipefail
          helpers="${RUNNER_TEMP}/helpers.sh"
          cat > "${helpers}" <<'HELPERS'
          # Read a state sub-key for an env from the manifest via the CLI.
          state_sha() {
            cascade status env "$1" --json | jq -r '.state.sha // empty'
          }
          state_version() {
            cascade status env "$1" --json | jq -r '.state.version // empty'
          }
          # Assert a value matches a regex, failing the step on mismatch.
          assert_match() {
            local label="$1" value="$2" pattern="$3"
            if [[ "${value}" =~ ${pattern} ]]; then
              echo "  ok: ${label} (${value}) matches ${pattern}"
            else
              echo "::error::${label} value '${value}' does not match ${pattern}"
              return 1
            fi
          }
          assert_equal() {
            local label="$1" got="$2" want="$3"
            if [[ "${got}" == "${want}" ]]; then
              echo "  ok: ${label} == ${want}"
            else
              echo "::error::${label} expected '${want}' got '${got}'"
              return 1
            fi
          }
          # Look up a release by tag and print its draft/prerelease/latest flags.
          release_flag() {
            gh release view "$1" --json "$2" --jq ".$2" 2>/dev/null || echo "missing"
          }
          # Snapshot all four env states plus tags and releases into one string so
          # dry-run steps can compare before and after.
          full_snapshot() {
            for e in dev test staging prod; do
              printf 'env:%s sha:%s ver:%s\n' "${e}" "$(state_sha "${e}")" "$(state_version "${e}")"
            done
            echo "tags:"
            git tag --sort=-creatordate
            echo "releases:"
            gh release list --json tagName,isDraft,isPrerelease,isLatest \
              --jq '.[] | "\(.tagName) draft=\(.isDraft) pre=\(.isPrerelease) latest=\(.isLatest)"' \
              | sort
          }
          # Bounded wait for a workflow_dispatch run that THIS suite triggered.
          # workflow_dispatch carries no merge commit to key on, so callers
          # capture a UTC timestamp immediately before `gh workflow run` and
          # pass it here. The run created at/after that timestamp is the one we
          # fired; we capture its databaseId and poll THAT exact run to
          # completion rather than grabbing the global newest run, which a
          # stale or concurrent dispatch could otherwise win. Prints the run
          # conclusion on success.
          wait_for_dispatched_run() {
            local wf="$1" since="$2" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                run_id="$(gh run list --workflow "${wf}" --created ">=${since}" \
                  --json databaseId,headBranch,status \
                  --jq '.[0].databaseId // empty')"
                # Expose the resolved run id to the caller (write once) so the
                # following register-run step can record it in the reconcile
                # ledger. Side channel only; stdout still carries the conclusion.
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for dispatched ${wf} run since ${since}"
            return 1
          }
          # Wait for the orchestrate run fired by a specific merge commit on main,
          # keyed on headSha so a stale or concurrent run is never mistaken for
          # this one. Prints the run conclusion on success.
          wait_for_orchestrate_sha() {
            local merge_sha="$1" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              run_id="$(gh run list --workflow orchestrate.yaml --branch main \
                --json databaseId,headSha,status \
                --jq ".[] | select(.headSha==\"${merge_sha}\") | .databaseId" \
                | head -n1)"
              # Expose the resolved orchestrate run id to the caller (write once)
              # so the following register-run step can record it in the reconcile
              # ledger. Side channel only; stdout still carries the conclusion.
              if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ] \
                && [ ! -s "${RESOLVED_RUN_ID_FILE}" ]; then
                echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for orchestrate run for ${merge_sha}"
            return 1
          }
          # Land a src/** change on main through a branch -> PR -> rebase-merge.
          # Rebase replays the branch commit onto main and preserves its
          # github-actions[bot] author. The commit message carries the
          # conventional type. Prints the merge commit SHA on origin/main.
          seed_via_pr() {
            local file="$1" content="$2" title="$3" branch sha
            branch="scenario/src-$(date +%s)-${RANDOM}"
            # Route all command chatter to stderr so the function's stdout is
            # ONLY the merge SHA (callers capture it via command substitution).
            {
              git fetch origin main --quiet
              git checkout -B "${branch}" origin/main
              mkdir -p src
              printf '%s\n' "${content}" > "${file}"
              git add "${file}"
              git commit --no-gpg-sign -s -m "${title}"
              git push origin "${branch}"
              gh pr create --base main --head "${branch}" \
                --title "${title}" \
                --body "Automated scenario run; drives orchestrate on merge."
              gh pr merge "${branch}" --rebase --delete-branch
              git fetch origin main --quiet
            } >&2
            sha="$(git rev-parse origin/main)"
            printf '%s\n' "${sha}"
          }
          # Refresh local trunk and poll until the named env carries a version.
          # cascade's finalize job pushes the "update state" commit to main a
          # few seconds after the orchestrate/promote run reports success, so a
          # single fetch+reset can read the pre-state-commit manifest. Re-fetch
          # trunk and re-read until the env is populated (up to ~60s).
          sync_env_state() {
            local env="$1" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_version "${env}")" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} state to land on trunk"
            return 1
          }
          # Like sync_env_state, but poll until the env's sha differs from a
          # known prior value. A rollback re-writes an env that ALREADY carries
          # a version, so a plain non-empty poll returns the stale pre-rollback
          # state immediately. Pass the pre-rollback sha and wait for the
          # finalize state commit that actually changes it.
          sync_env_state_until_sha_changed() {
            local env="$1" prior_sha="$2" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_sha "${env}")" ] && [ "$(state_sha "${env}")" != "${prior_sha}" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} sha to change from ${prior_sha} on trunk"
            return 1
          }
          # Read the divergence ref an env carries (set to rollback/<env> after a
          # manual rollback, empty on the linear promotion line).
          state_ref() {
            cascade status env "$1" --json | jq -r '.state.ref // empty'
          }
          # Force the remote env/<env> branch tip back to that env's OWN recorded
          # state.<env>.sha. cascade's contract is that env/<env> tip always
          # equals recorded state, and the hotfix planner derives its cherry-pick
          # base from recorded state and fail-closes when a live env tip has
          # drifted. This repo's env/* branches are shared across the suite's
          # parallel jobs, so a sibling job's seed can leave a stale tip behind;
          # resetting to the recorded SHA clears that residue deterministically
          # WITHOUT recreating any divergence. Requires GH_TOKEN (admin PAT) in
          # the step env to bypass branch protection. In-suite git only, no GPG.
          reset_env_to_recorded() {
            local env="$1" e_sha push_remote
            git fetch origin main --quiet
            e_sha="$(state_sha "${env}")"
            [ -n "${e_sha}" ] \
              || { echo "::error::cannot reset env/${env}: recorded state SHA empty"; return 1; }
            push_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force "${push_remote}" "${e_sha}:refs/heads/env/${env}" \
              || { echo "::error::failed to reset env/${env} to recorded state"; return 1; }
          }
          # Close any open cascade-hotfix / cascade-hotfix-conflict PR before a
          # hotfix stage dispatches. The generated plan job passes --repo, which
          # arms the single-flight gate: it aborts a fresh hotfix while an open
          # hotfix PR already targets the env. A prior run that ended mid-hotfix
          # can strand such a PR, so close each one and drop its head branch to
          # normalize state. Scoped to the two hotfix labels; other open PRs are
          # left untouched.
          close_open_hotfix_prs() {
            local label num
            for label in cascade-hotfix cascade-hotfix-conflict; do
              for num in $(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
                --label "${label}" --json number --jq '.[].number' 2>/dev/null || true); do
                gh pr close "${num}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                  && echo "closed stale ${label} PR #${num}" \
                  || echo "::warning::could not close ${label} PR #${num}"
              done
            done
          }
          # Append a PASS/FAIL row to the job summary table.
          summarize() {
            printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "${GITHUB_STEP_SUMMARY}"
          }
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                if [ "$attempt" -gt 1 ]; then
                  printf 'gh: giving up after %d attempts (exit %d)\n' "$attempt" "$rc" >&2
                fi
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          HELPERS
          echo "BASH_ENV=${helpers}" >> "${GITHUB_ENV}"
          {
            echo "## scenario-suite results"
            echo ""
            echo "| step | result | detail |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Verify manifest parses
        run: |
          set -euo pipefail
          cascade parse-config -c "${MANIFEST}"
          summarize "parse-config" "PASS" "manifest ${MANIFEST} key ${MANIFEST_KEY} parses"

      - name: Step 1 - reset and seed dev
        id: step1
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          # Clear any hotfix PR a crashed prior run stranded so the single-flight
          # gate does not abort this job's hotfix stages (Step 3g / Step 3h).
          close_open_hotfix_prs
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true; done
          git fetch --tags --quiet || true
          for t in $(git tag -l 'v*' 'rel-*'); do git push origin --delete "$t" 2>/dev/null || true; done
          # cascade reset reads trunk, rewrites manifest state, and pushes the
          # result. On the live fleet a concurrent writer can advance main between
          # the read and the push, so a plain push is rejected non-fast-forward.
          # Retry with bounded, growing backoff: on a rejected push, refresh the
          # checkout to the current trunk tip and re-run reset so it re-reads the
          # now-current main, re-applies the reset, and re-pushes. Fail closed if
          # trunk keeps advancing past the attempt budget.
          reset_pushed=false
          for attempt in 1 2 3 4 5; do
            if cascade reset --state --push; then
              reset_pushed=true
              break
            fi
            echo "reset push attempt ${attempt} rejected; refreshing trunk and retrying"
            git fetch origin main --quiet
            git reset --hard origin/main >/dev/null
            sleep "$((attempt * 5))"
          done
          if [ "${reset_pushed}" != true ]; then
            echo "::error::cascade reset --state --push failed after 5 attempts; trunk kept advancing"
            exit 1
          fi
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          merge_sha="$(seed_via_pr \
            src/release-marker.txt \
            "build stamp ${stamp}" \
            "feat: seed validation marker ${stamp}")"
          echo "Waiting for orchestrate run on merge SHA: ${merge_sha}"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step1-orchestrate-run-id"
          orchestrate="$(wait_for_orchestrate_sha "${merge_sha}")"
          echo "orchestrate_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          # Refresh local checkout - orchestrate's finalize job pushes a state-update
          # commit to main a few seconds after the workflow completes; poll trunk
          # until dev carries a version before reading it back, otherwise cascade
          # status reads the pre-orchestrate manifest and state asserts race.
          sync_env_state dev
          assert_equal "orchestrate conclusion" "${orchestrate}" "success"
          rc_tag="$(git ls-remote --tags origin '*-rc.0' | head -n1 | sed 's#.*refs/tags/##')"
          assert_match "rc.0 tag" "${rc_tag}" "${RC_RE}"
          assert_equal "dev release is draft" "$(release_flag "${rc_tag}" isDraft)" "true"
          dev_sha="$(state_sha dev)"
          dev_ver="$(state_version dev)"
          assert_match "dev sha" "${dev_sha}" "${SHA_RE}"
          assert_match "dev version" "${dev_ver}" "${RC_RE}"
          summarize "1 reset+seed" "PASS" "Deployed: dev at ${dev_ver} draft rc.0"

      - name: Register Step 1 seed orchestrate run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step1.outputs.orchestrate_run_id }}
          expected-conclusion: success
          reason: step1-seed-orchestrate
          upload: 'true'

      - name: Step 2 - promote dev to test
        id: step2
        run: |
          set -euo pipefail
          dev_ver="$(state_version dev)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step2-promote-run-id"
          gh workflow run promote.yaml -f mode=dev-to-test -f dry_run=false
          conclusion="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "promote_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "promote dev-to-test conclusion" "${conclusion}" "success"
          # Poll trunk until the promote's state commit for test lands.
          sync_env_state test
          test_ver="$(state_version test)"
          assert_equal "test matches dev version" "${test_ver}" "${dev_ver}"
          assert_match "test sha" "$(state_sha test)" "${SHA_RE}"
          rc_tag="$(git ls-remote --tags origin '*-rc.0' | head -n1 | sed 's#.*refs/tags/##')"
          assert_equal "release still draft" "$(release_flag "${rc_tag}" isDraft)" "true"
          summarize "2 dev->test" "PASS" "test at ${test_ver}, release draft rc.0"

      - name: Register Step 2 promote dev-to-test run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step2.outputs.promote_run_id }}
          expected-conclusion: success
          reason: step2-promote-dev-to-test
          upload: 'true'

      - name: Step 3 - promote test to staging
        id: step3
        run: |
          set -euo pipefail
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step3-promote-run-id"
          gh workflow run promote.yaml -f mode=test-to-staging -f dry_run=false
          conclusion="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "promote_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "promote test-to-staging conclusion" "${conclusion}" "success"
          # Poll trunk until the promote's state commit for staging lands.
          sync_env_state staging
          staging_ver="$(state_version staging)"
          assert_match "staging version" "${staging_ver}" "${RC_RE}"
          rc_tag="$(git ls-remote --tags origin '*-rc.*' | head -n1 | sed 's#.*refs/tags/##')"
          assert_equal "release is prerelease" "$(release_flag "${rc_tag}" isPrerelease)" "true"
          assert_equal "release no longer draft" "$(release_flag "${rc_tag}" isDraft)" "false"
          summarize "3 test->staging" "PASS" "staging prerelease at ${staging_ver}"

      - name: Register Step 3 promote test-to-staging run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step3.outputs.promote_run_id }}
          expected-conclusion: success
          reason: step3-promote-test-to-staging
          upload: 'true'

      # ---------------------------------------------------------------------
      # Step 3g - orphan env-branch self-heal preflight. An interrupted hotfix
      # can leave a standing env/<env> integration branch whose tip no longer
      # matches the env's recorded state, with NO divergence recorded (the
      # finalize that records divergence never ran). Before the self-heal a
      # later hotfix plan failed closed on that stale tip and needed manual
      # branch surgery. The planner now treats such a branch as an abandoned
      # orphan - not diverged AND the single-flight gate found no open
      # resolution PR - and force-resets it back to the recorded base so the
      # plan proceeds instead of aborting.
      #
      # This runs as a NON-MUTATING dry-run dispatch: the dry-run plan reports
      # the reset decision (branch_reset plus the diagnostic marker) while
      # exercising the real single-flight PR gate and the real remote env tip,
      # without finalizing divergence. That keeps test on its linear line for
      # the Step 3h multi-env hotfix that follows. The reset-and-proceed
      # mutation itself is covered by the unit suite and the act e2e scenario;
      # the fleet's job is to prove the self-heal decision survives on real
      # GitHub against a real orphan branch and a real PR gate.
      #
      # The self-heal engages only when the generated cascade-hotfix.yaml plan
      # step passes --repo, which wires the planner to a real single-flight
      # checker. Repos whose workflows predate that generator change skip this
      # step rather than fail closed, so the scenario activates the moment the
      # workflows are regenerated.
      # ---------------------------------------------------------------------
      - name: Step 3g - dispatch orphan self-heal preflight
        id: orphan_seed
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          # Gate: the self-heal needs the plan step to run with --repo so the
          # single-flight gate uses a real checker. Older generated workflows
          # omit it; skip cleanly until they are regenerated.
          if ! grep -A8 'cascade hotfix plan' .github/workflows/cascade-hotfix.yaml \
              | grep -q -- '--repo'; then
            echo "orphan self-heal not wired (cascade-hotfix.yaml plan lacks --repo); skipping"
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            summarize "3g orphan self-heal" "SKIP" "plan step lacks --repo; regenerate to enable"
            exit 0
          fi
          echo "skipped=false" >> "${GITHUB_OUTPUT}"

          sync_env_state test
          base_sha="$(state_sha test)"
          [ -n "${base_sha}" ] || { echo "::error::test has no recorded SHA"; exit 1; }
          assert_equal "test not diverged before orphan" "$(state_ref test)" ""

          # Land a real trunk fix the dry-run hotfix will reference. It lives
          # OUTSIDE src/** so the merge does NOT fire orchestrate (no extra run
          # to reconcile), and it is a descendant of the recorded base so the
          # plan's no-op ancestry check does not short-circuit before the branch
          # reconciliation where the self-heal lives.
          fix_sha="$(seed_via_pr \
            ".cascade-selfheal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" \
            "orphan self-heal fix $(date -u +%FT%TZ)" \
            "chore: orphan self-heal fix (non-deploy)")"
          [ -n "${fix_sha}" ] || { echo "::error::could not land self-heal fix on trunk"; exit 1; }
          [ "${fix_sha}" != "${base_sha}" ] \
            || { echo "::error::fix sha equals recorded base; cannot prove self-heal"; exit 1; }

          # Manufacture the orphan: force env/test to the fix tip so it leads the
          # recorded base while state.test stays NOT diverged. That is exactly an
          # abandoned hotfix integration branch - the population the self-heal
          # targets. Pushing env/* triggers no workflow in this repo.
          push_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "${push_remote}" "${fix_sha}:refs/heads/env/test"

          # Dispatch the hotfix in dry-run. The plan derives the base from the
          # recorded state, finds env/test ahead with no divergence and (via
          # --repo) no open resolution PR, and reports the orphan reset rather
          # than aborting on the stale tip.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run cascade-hotfix.yaml \
            -f commit="${fix_sha}" -f target_env=test -f dry_run=true \
            || { echo "::error::failed to dispatch orphan self-heal hotfix"; exit 1; }
          {
            echo "dispatch_ts=${ts}"
            echo "fix_sha=${fix_sha}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "dispatched dry-run hotfix for test against orphan env/test at ${fix_sha}"

      - name: Step 3g - await self-heal and assert orphan reset
        id: orphan_assert
        if: steps.orphan_seed.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step3g-hotfix-run-id"
          conclusion="$(wait_for_dispatched_run cascade-hotfix.yaml \
            "${{ steps.orphan_seed.outputs.dispatch_ts }}")"
          run_id="$(cat "${RESOLVED_RUN_ID_FILE}")"
          echo "hotfix_run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          # SUCCESS proves the plan did NOT fail closed on the stale env/test
          # tip; before the self-heal this dispatch aborted with the env-tip
          # divergence error.
          assert_equal "orphan self-heal hotfix conclusion" "${conclusion}" "success"
          # The diagnostic marker is emitted only when the planner resets the
          # orphan, so it distinguishes a genuine self-heal from a plan that
          # succeeded for another reason (branch already at base, freshly
          # created, and so on).
          log="$(gh run view "${run_id}" --log 2>/dev/null || true)"
          if printf '%s' "${log}" \
              | grep -qE "orphan env/test branch was reset to recorded base"; then
            echo "  ok: self-heal marker present for env/test"
          else
            echo "::error::self-heal marker absent; plan did not reset orphan env/test"
            exit 1
          fi
          # Dry-run mutates nothing: state stays not diverged and the recorded
          # base is unchanged, so Step 3h still finds test on its linear line.
          sync_env_state test
          assert_equal "test still not diverged after dry-run" "$(state_ref test)" ""
          assert_equal "recorded base unchanged" "$(state_sha test)" \
            "${{ steps.orphan_seed.outputs.base_sha }}"
          summarize "3g orphan self-heal" "PASS" \
            "env/test orphan reset to recorded base; hotfix plan proceeded"

      # Restore env/test to its recorded base so the Step 3h reset-and-cherry-
      # pick starts from a clean baseline; the orphan tip forced above would
      # otherwise be stale residue for the next hotfix. Runs after the dry-run
      # completes, so it never races the plan job that inspects the orphan.
      - name: Step 3g - restore env/test baseline
        if: steps.orphan_seed.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          reset_env_to_recorded test

      - name: Register Step 3g orphan self-heal hotfix run
        if: steps.orphan_seed.outputs.skipped == 'false'
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.orphan_assert.outputs.hotfix_run_id }}
          expected-conclusion: success
          reason: step3g-orphan-self-heal-dry-run
          upload: 'true'

      # ---------------------------------------------------------------------
      # Step 3h - multi-env hotfix: elevate a SET of trunk commits to a
      # MID-chain env. The four-env chain is [dev, test, staging, prod]; a
      # hotfix targeting staging applies the patch set bottom-up to every
      # intermediate env between the build target and the requested target,
      # i.e. [test, staging]. The FIRST env (dev) is excluded by the planner
      # and the env ABOVE the target (prod) is never reached, so both stay on
      # the linear promotion line with no divergence. This is the per-env
      # spread the multi-commit / multi-env hotfix produces, and the value the
      # live fleet adds over the in-repo e2e (which runs against gitea).
      #
      # Preconditions met here: Step 3 left dev, test, and staging carrying RC
      # versions and SHAs, and prod is still unset (Step 4 publishes it). The
      # generated cascade-hotfix.yaml takes a comma-delimited commit SET via the
      # `commit` input (passed to the CLI as --commits) and opens one
      # cascade-hotfix PR per chain env into env/<env>, auto-merging clean
      # cherry-picks. The repository must allow auto-merge.
      # ---------------------------------------------------------------------
      - name: Step 3h - seed two trunk fixes and dispatch multi-env hotfix
        id: hotfix_multi_seed
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          # The chain anchors on the target env's recorded SHA and walks the
          # intermediate envs, so both test and staging must carry state.
          sync_env_state test
          sync_env_state staging
          for e in test staging; do
            if [ -z "$(state_version "${e}")" ] || [ -z "$(state_sha "${e}")" ]; then
              echo "::error::hotfix precondition: state.${e} version/sha empty"
              exit 1
            fi
          done

          # Capture the untouched-env baselines BEFORE the hotfix runs. dev is
          # the first env (planner excludes it from the chain) and is already
          # seeded from Step 1; prod sits above the target and is still unset.
          # Both must read back identically after the hotfix.
          dev_sha_before="$(state_sha dev)"
          dev_ref_before="$(state_ref dev)"

          # Reset every chain env branch to its OWN recorded state SHA so the
          # branch tip matches the cherry-pick base cascade derives from
          # recorded state.<env>.sha. A finalized hotfix always leaves env/<env>
          # tip equal to recorded state, and the plan refuses to run when a live
          # env tip has drifted from recorded state; resetting to the recorded
          # SHA clears prior-run accumulation deterministically WITHOUT recreating
          # that divergence. The fresh fixes land on trunk below, past each
          # recorded base, so they are still absent from these branches and the
          # cherry-picks proceed. See reset_env_to_recorded in the helper block.
          for e in test staging; do
            reset_env_to_recorded "${e}"
          done

          # Land TWO fresh fixes on trunk in run-unique files so the set never
          # conflicts with itself or with prior-run residue. Each lands via a
          # branch -> PR -> rebase merge; rebase replays the branch commit onto
          # main as the hotfix, keeping its github-actions[bot] author.
          fixes=""
          for n in 1 2; do
            branch="scenario/hotfix-multi-${n}-$(date +%s)-${RANDOM}"
            git fetch origin main --quiet
            git checkout -B "${branch}" origin/main
            mkdir -p src
            fix_file="src/hotfix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${n}.txt"
            echo "// multi-env hotfix change ${n} $(date -u +%FT%TWZ)" > "${fix_file}"
            git add "${fix_file}"
            git commit --no-gpg-sign -s -m "fix: multi-env hotfix patch ${n}"
            git push origin "${branch}"
            gh pr create --base main --head "${branch}" \
              --title "fix: multi-env hotfix patch ${n}" \
              --body "Trunk fix ${n} elevated to staging via the hotfix chain."
            gh pr merge "${branch}" --rebase --delete-branch
            git fetch origin main --quiet
            sha="$(git rev-parse origin/main)"
            fixes="${fixes:+${fixes},}${sha}"
          done

          # The second fix merge also triggers orchestrate (src/** changed). Let
          # it settle dev before the hotfix targets staging so the two flows do
          # not contend on trunk state writes, then re-capture dev's baseline so
          # the no-clobber assert compares like-for-like. The FIRST fix merge also
          # touches src/** and may fire an orchestrate run that orchestrate's own
          # concurrency cancels in favor of this second one; that superseded run
          # is benign and is intentionally NOT registered (it shares the
          # workflow + main lane with the run registered here, which excuses it).
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step3h-seed-orchestrate-run-id"
          orchestrate="$(wait_for_orchestrate_sha "${sha}")"
          echo "seed_orchestrate_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "seed orchestrate conclusion" "${orchestrate}" "success"
          sync_env_state dev
          dev_sha_before="$(state_sha dev)"
          dev_ref_before="$(state_ref dev)"

          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run cascade-hotfix.yaml \
            -f commit="${fixes}" -f target_env=staging -f dry_run=false \
            || { echo "::error::failed to dispatch multi-env hotfix"; exit 1; }
          {
            echo "commits=${fixes}"
            echo "dispatch_ts=${ts}"
            echo "dev_sha_before=${dev_sha_before}"
            echo "dev_ref_before=${dev_ref_before}"
          } >> "${GITHUB_OUTPUT}"
          echo "dispatched multi-env hotfix [${fixes}] -> staging"

      - name: Step 3h - await chain and assert per-env divergence
        id: hotfix_await
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step3h-hotfix-dispatch-run-id"
          conclusion="$(wait_for_dispatched_run cascade-hotfix.yaml \
            "${{ steps.hotfix_multi_seed.outputs.dispatch_ts }}")"
          echo "dispatch_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "multi-env hotfix conclusion" "${conclusion}" "success"

          # The chain opens and merges one cascade-hotfix PR per env (test, then
          # staging), then each PR-close run finalizes that env's divergence
          # state. Poll trunk until staging (the last chain env) records its
          # divergence ref, then read every env back.
          ref=""
          for _ in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main >/dev/null
            ref="$(state_ref staging)"
            [ "${ref}" = "env/staging" ] && break
            sleep 60
          done

          IFS=',' read -r c1 c2 <<<"${{ steps.hotfix_multi_seed.outputs.commits }}"
          # Both intermediate envs must diverge onto their env/<env> ref, carry
          # an RC hotfix version, and record BOTH seeded SHAs in patches.
          for e in test staging; do
            assert_equal "hotfix ${e} diverged ref" "$(state_ref "${e}")" "env/${e}"
            assert_match "hotfix ${e} version" "$(state_version "${e}")" '\-rc\..*\.hotfix\.[0-9]+$'
            patches="$(cascade status env "${e}" --json | jq -r '.state.patches[]? // empty')"
            echo "${patches}" | grep -qF "${c1}" \
              || { echo "::error::${e} patches missing ${c1}; got: ${patches}"; exit 1; }
            echo "${patches}" | grep -qF "${c2}" \
              || { echo "::error::${e} patches missing ${c2}; got: ${patches}"; exit 1; }
          done

          # The first env (dev) and the env above the target (prod) are outside
          # the chain: no divergence ref, and dev's sha is byte-identical to its
          # pre-hotfix baseline. prod is still unset at this point in the ladder,
          # so it carries no ref and no sha.
          assert_equal "dev untouched ref" "$(state_ref dev)" \
            "${{ steps.hotfix_multi_seed.outputs.dev_ref_before }}"
          assert_equal "dev sha unchanged" "$(state_sha dev)" \
            "${{ steps.hotfix_multi_seed.outputs.dev_sha_before }}"
          assert_equal "prod untouched ref" "$(state_ref prod)" ""
          assert_equal "prod sha still unset" "$(state_sha prod)" ""
          summarize "3h multi-env hotfix" "PASS" \
            "test+staging diverged with both patches; dev+prod untouched"

          # Resolve the two pull_request-triggered Cascade Hotfix Finalize runs,
          # one per chain env (env/test and env/staging). The chain opens a
          # cascade-hotfix PR into each env branch; when it merges, a Finalize run
          # fires on the PR head branch keyed on the pull_request event. The suite
          # historically never inspected these (the fire-and-forget gap), so resolve
          # each, watch it to a success conclusion, and emit its run id so the
          # following register-run steps record both in the reconcile ledger. There
          # is NO env-branch gate workflow in this repo, so no gate run to resolve.
          # Anchor to the hotfix dispatch time so each finalize run is resolved by
          # identity (the earliest pull_request run on the PR head created at or
          # after the dispatch), never a stale prior run on a recycled hotfix
          # branch under concurrent fleet load.
          hotfix_since="${{ steps.hotfix_multi_seed.outputs.dispatch_ts }}"
          for e in test staging; do
            pr_head="$(gh pr list --base "env/${e}" --state all --label cascade-hotfix \
              --json number,headRefName --jq 'sort_by(.number) | last | .headRefName' \
              2>/dev/null || echo "")"
            [ -n "${pr_head}" ] \
              || { echo "::error::no merged cascade-hotfix PR found into env/${e}"; exit 1; }
            finalize_run_id=""
            for _ in $(seq 1 40); do
              finalize_run_id="$(gh run list --workflow=cascade-hotfix.yaml \
                --branch "${pr_head}" --event pull_request \
                --json databaseId,createdAt 2>/dev/null \
                | jq -r --arg since "${hotfix_since}" \
                    '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | .[0].databaseId // empty' \
                    2>/dev/null || echo "")"
              [ -n "${finalize_run_id}" ] && break
              sleep 30
            done
            [ -n "${finalize_run_id}" ] \
              || { echo "::error::no pull_request Cascade Hotfix finalize run for env/${e} head ${pr_head}"; exit 1; }
            gh run watch "${finalize_run_id}" --interval 60 --exit-status \
              || { echo "::error::env/${e} finalize run ${finalize_run_id} did not conclude success"; exit 1; }
            echo "finalize_${e}_run_id=${finalize_run_id}" >> "${GITHUB_OUTPUT}"
            echo "env/${e} finalize (pull_request) run ${finalize_run_id} concluded success"
          done

      - name: Register Step 3h seed orchestrate run
        if: steps.hotfix_multi_seed.outputs.seed_orchestrate_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.hotfix_multi_seed.outputs.seed_orchestrate_run_id }}
          expected-conclusion: success
          reason: step3h-seed-orchestrate
          upload: 'true'

      - name: Register Step 3h hotfix dispatch (plan/apply) run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.hotfix_await.outputs.dispatch_run_id }}
          expected-conclusion: success
          reason: step3h-hotfix-dispatch-plan-apply
          upload: 'true'

      - name: Register Step 3h finalize env/test run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.hotfix_await.outputs.finalize_test_run_id }}
          expected-conclusion: success
          reason: step3h-finalize-env-test
          upload: 'true'

      - name: Register Step 3h finalize env/staging run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.hotfix_await.outputs.finalize_staging_run_id }}
          expected-conclusion: success
          reason: step3h-finalize-env-staging
          upload: 'true'

      - name: Step 4 - diverged staging is blocked from promoting to prod
        id: step4
        run: |
          set -euo pipefail
          # Step 3h left staging diverged onto env/staging carrying two non-trunk
          # hotfix patches. The divergence guard MUST refuse to read a promotion
          # source from that diverged env: a non-trunk SHA may not propagate
          # upward to prod. Dispatch staging-to-prod and assert it FAILS, then
          # tie the failure to the guard by grepping the run log for the guard
          # message so an unrelated failure can never satisfy this assertion.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run promote.yaml -f mode=staging-to-prod -f dry_run=false
          # Capture the run id the same way wait_for_dispatched_run keys on it, so
          # the log fetch reads THIS dispatch and not a stale or concurrent run.
          run_id=""
          for _ in $(seq 1 15); do
            if [ -z "${run_id}" ]; then
              run_id="$(gh run list --workflow promote.yaml --created ">=${ts}" \
                --json databaseId --jq '.[0].databaseId // empty')"
            fi
            if [ -n "${run_id}" ]; then
              status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
              [ "${status}" = "completed" ] && break
            fi
            sleep 60
          done
          if [ -z "${run_id}" ]; then
            echo "::error::could not locate the dispatched staging-to-prod run"
            exit 1
          fi
          # Surface the blocked run id so the following register-run step records
          # it as a NEGATIVE (expected-conclusion: failure) in the reconcile
          # ledger. Reuse the id already captured by the poll above.
          echo "divergence_run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          conclusion="$(gh run view "${run_id}" --json conclusion --jq '.conclusion // "none"')"
          assert_equal "diverged staging-to-prod blocked" "${conclusion}" "failure"
          # The preflight failure must be the divergence guard specifically. Grep
          # the failed run log for both halves of the guard message; a bare
          # failure (e.g. infra) would not carry this text and must not pass.
          guard_log="$(gh run view "${run_id}" --log-failed 2>/dev/null \
            || gh run view "${run_id}" --log 2>/dev/null || echo '')"
          if ! printf '%s' "${guard_log}" | grep -qF 'cannot promote from diverged environment'; then
            echo "::error::staging-to-prod failed but not via the divergence guard"
            echo "::error::expected log to mention 'cannot promote from diverged environment'"
            exit 1
          fi
          if ! printf '%s' "${guard_log}" | grep -qF 'must not propagate upward'; then
            echo "::error::guard message incomplete; expected 'must not propagate upward'"
            exit 1
          fi
          echo "  ok: divergence guard refused staging-to-prod (diverged source)"
          # prod must stay UNPUBLISHED: the blocked promote writes no state.
          sync_env_state staging
          assert_equal "prod still unset after blocked promote" "$(state_version prod)" ""
          # Publish prod via the guard's own sanctioned escape hatch: promote from
          # a lower, non-diverged env. dev is on the linear line (Step 3h asserted
          # it untouched), so dev-to-prod carries a clean trunk SHA to prod. This
          # keeps the downstream rollback steps meaningful (they need a published
          # prod with two distinct versions in its deploy-history ring).
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step4-clean-promote-run-id"
          gh workflow run promote.yaml -f mode=dev-to-prod -f dry_run=false
          clean="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "clean_promote_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "clean dev-to-prod promote conclusion" "${clean}" "success"
          # Poll trunk until the promote's state commit for prod lands.
          sync_env_state prod
          prod_ver="$(state_version prod)"
          assert_match "prod version" "${prod_ver}" "${VERSION_RE}"
          assert_equal "published release not draft" "$(release_flag "${prod_ver}" isDraft)" "false"
          assert_equal "published release not prerelease" "$(release_flag "${prod_ver}" isPrerelease)" "false"
          assert_equal "published release is latest" "$(gh release list --json tagName,isLatest --jq ".[] | select(.tagName==\"${prod_ver}\") | .isLatest" 2>/dev/null || echo missing)" "true"
          remaining_rc="$(git ls-remote --tags origin '*-rc.*' | wc -l | tr -d ' ')"
          assert_equal "rc tags cleaned up" "${remaining_rc}" "0"
          summarize "4 diverged staging blocked" "PASS" \
            "staging->prod refused by divergence guard; prod published ${prod_ver} via dev-to-prod"

      # NEGATIVE: the diverged staging-to-prod promote MUST conclude failure (the
      # divergence guard refused it). Registered expected-conclusion: failure so
      # reconcile treats it as accounted-for, and a run that wrongly SUCCEEDS (the
      # guard regressed) reds the gate instead of passing as benign.
      - name: Register Step 4 divergence-guard blocked run
        if: steps.step4.outputs.divergence_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step4.outputs.divergence_run_id }}
          expected-conclusion: failure
          reason: step4-divergence-guard-blocked
          upload: 'true'

      - name: Register Step 4 clean dev-to-prod run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step4.outputs.clean_promote_run_id }}
          expected-conclusion: success
          reason: step4-clean-dev-to-prod
          upload: 'true'

      - name: Step 4b - second cascade publishes a newer prod version
        id: step4b
        run: |
          set -euo pipefail
          # A rollback can only resolve a prior target once prod has carried two
          # distinct versions: the second deploy records the displaced state in
          # prod's deploy-history ring. Land a second feat: marker so the next
          # orchestrate bumps the minor (v0.1.0 -> v0.2.0), then cascade the new
          # artifact dev-to-prod in one dispatch so prod publishes v0.2.0.
          first_prod_ver="$(state_version prod)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          merge_sha="$(seed_via_pr \
            src/release-marker.txt \
            "build stamp ${stamp}" \
            "feat: bump validation marker ${stamp}")"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step4b-seed-orchestrate-run-id"
          orchestrate="$(wait_for_orchestrate_sha "${merge_sha}")"
          echo "seed_orchestrate_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          sync_env_state dev
          assert_equal "second orchestrate conclusion" "${orchestrate}" "success"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step4b-cascade-run-id"
          gh workflow run promote.yaml -f mode=dev-to-prod -f dry_run=false
          conclusion="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "cascade_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "dev-to-prod cascade conclusion" "${conclusion}" "success"
          # The promote finalize pushes prod's state commit moments after the run
          # reports success; poll until prod's version moves off the prior value.
          i=0
          while [ "${i}" -lt 2 ]; do
            git fetch origin main --quiet
            git reset --hard origin/main >/dev/null
            cur="$(state_version prod)"
            if [ -n "${cur}" ] && [ "${cur}" != "${first_prod_ver}" ]; then
              break
            fi
            i=$((i + 1))
            sleep 60
          done
          second_prod_ver="$(state_version prod)"
          assert_match "second prod version" "${second_prod_ver}" "${VERSION_RE}"
          if [[ "${second_prod_ver}" == "${first_prod_ver}" ]]; then
            echo "::error::second cascade did not advance prod past ${first_prod_ver}"
            exit 1
          fi
          summarize "4b second cascade" "PASS" "prod advanced ${first_prod_ver} -> ${second_prod_ver}"

      - name: Register Step 4b seed orchestrate run
        if: steps.step4b.outputs.seed_orchestrate_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step4b.outputs.seed_orchestrate_run_id }}
          expected-conclusion: success
          reason: step4b-seed-orchestrate
          upload: 'true'

      - name: Register Step 4b dev-to-prod cascade run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step4b.outputs.cascade_run_id }}
          expected-conclusion: success
          reason: step4b-cascade-dev-to-prod
          upload: 'true'

      - name: Step 5 - rollback prod
        id: step5
        run: |
          set -euo pipefail
          # prod now carries v0.2.0 with v0.1.0 retained in its deploy-history
          # ring. A manual rollback (no explicit target) resolves that prior,
          # re-deploys its SHA, rewrites prod's state to the older version, and
          # marks prod diverged (ref=rollback/prod). It does NOT touch any
          # release object - the published v0.2.0 and v0.1.0 releases stand.
          cur_ver="$(state_version prod)"
          cur_sha="$(state_sha prod)"
          # Re-derive the prior published version from releases so the assertion
          # does not depend on a value carried across steps.
          prior_ver="$(gh release list --json tagName,isLatest \
            --jq "[.[] | select(.tagName != \"${cur_ver}\") | .tagName] | .[0]" 2>/dev/null || echo '')"
          cur_release_draft="$(release_flag "${cur_ver}" isDraft)"
          prior_release_draft="$(release_flag "${prior_ver}" isDraft)"
          # Drive the generated Rollback workflow (cascade-rollback.yaml). The
          # standalone `cascade rollback` rewrites only the local manifest and
          # never reaches trunk; the workflow's finalize commits the rolled-back
          # state, which is what this suite reads back from origin/main.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step5-rollback-run-id"
          gh workflow run cascade-rollback.yaml -f environment=prod -f dry_run=false
          conclusion="$(wait_for_dispatched_run cascade-rollback.yaml "${ts}")"
          echo "rollback_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "rollback workflow conclusion" "${conclusion}" "success"
          # Rollback re-writes an env that already has a version, so poll until
          # prod's sha actually changes off its pre-rollback value rather than
          # accepting the stale current state.
          sync_env_state_until_sha_changed prod "${cur_sha}"
          new_prod_sha="$(state_sha prod)"
          new_prod_ver="$(state_version prod)"
          new_prod_ref="$(state_ref prod)"
          assert_match "prod sha after rollback" "${new_prod_sha}" "${SHA_RE}"
          assert_equal "prod rolled back to prior version" "${new_prod_ver}" "${prior_ver}"
          if [[ "${new_prod_ver}" == "${cur_ver}" ]]; then
            echo "::error::prod version did not change after rollback (still ${cur_ver})"
            exit 1
          fi
          assert_equal "prod marked diverged by rollback" "${new_prod_ref}" "rollback/prod"
          assert_equal "rolled-back release untouched" \
            "$(release_flag "${prior_ver}" isDraft)" "${prior_release_draft}"
          assert_equal "superseded release untouched" \
            "$(release_flag "${cur_ver}" isDraft)" "${cur_release_draft}"
          summarize "5 rollback prod" "PASS" "prod ${cur_ver} -> ${new_prod_ver}, diverged, releases untouched"

      - name: Register Step 5 rollback prod run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step5.outputs.rollback_run_id }}
          expected-conclusion: success
          reason: step5-rollback-prod
          upload: 'true'

      - name: Step 5b - rollback aborts state write when the re-deploy fails
        id: step5b
        run: |
          set -euo pipefail
          # Gap 1: a rollback whose re-deploy FAILS must leave trunk state exactly
          # where it was. prod is currently rolled back to the prior version with
          # ref=rollback/prod (Step 5). Force the deploy stub to exit non-zero via
          # the FORCE_DEPLOY_FAIL repo variable, dispatch a non-dry-run rollback so
          # the re-deploy actually runs, and assert the run concludes failure and
          # prod's version/sha are UNCHANGED (finalize aborts the state write on a
          # failed in-scope deploy, exactly as the local harness proves).
          prior_ver="$(state_version prod)"
          prior_sha="$(state_sha prod)"
          gh variable set FORCE_DEPLOY_FAIL --body true --repo "${GITHUB_REPOSITORY}"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step5b-rollback-run-id"
          gh workflow run cascade-rollback.yaml -f environment=prod -f dry_run=false
          conclusion="$(wait_for_dispatched_run cascade-rollback.yaml "${ts}")"
          echo "rollback_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "rollback-on-failed-deploy conclusion" "${conclusion}" "failure"
          # Re-sync trunk and assert nothing moved: the finalize state write must
          # have been aborted, so version and sha hold their pre-dispatch values
          # and no NEW rollback ref divergence was introduced.
          git fetch origin main --quiet
          git reset --hard origin/main >/dev/null
          after_ver="$(state_version prod)"
          after_sha="$(state_sha prod)"
          assert_equal "prod version unchanged after failed deploy" "${after_ver}" "${prior_ver}"
          assert_equal "prod sha unchanged after failed deploy" "${after_sha}" "${prior_sha}"
          summarize "5b failed-deploy rollback" "PASS" "run failed, prod ${after_ver} state write aborted"

      - name: Step 5b cleanup - clear FORCE_DEPLOY_FAIL
        if: always()
        run: |
          set -euo pipefail
          # Mandatory: a stranded FORCE_DEPLOY_FAIL=true reds every later deploy in
          # this and every future fleet run (and the README badge), so reset it on
          # success AND on failure.
          gh variable set FORCE_DEPLOY_FAIL --body false --repo "${GITHUB_REPOSITORY}"
          summarize "5b cleanup" "PASS" "FORCE_DEPLOY_FAIL reset to false"

      # NEGATIVE: the rollback whose re-deploy was forced to fail MUST conclude
      # failure (finalize aborts the state write on a failed in-scope deploy).
      # Registered expected-conclusion: failure so reconcile accounts for it and a
      # run that wrongly SUCCEEDS reds the gate.
      - name: Register Step 5b rollback failed-deploy run
        if: steps.step5b.outputs.rollback_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step5b.outputs.rollback_run_id }}
          expected-conclusion: failure
          reason: step5b-rollback-failed-deploy
          upload: 'true'

      - name: Step 5e - roll-forward rejoins the rolled-back prod env
        id: step5e
        run: |
          set -euo pipefail
          # Gap 2: a forward promotion onto a rolled-back env ends the divergence.
          # prod still carries ref=rollback/prod from Step 5 (Step 5b aborted, so
          # the divergence stands). Confirm the diverged start, then roll forward by
          # cascading the newer dev artifact onto prod (the Step 4b dev-to-prod
          # idiom). The rejoin clears the divergence fields: ref and base_sha read
          # back empty, mirroring the local rollforward-rejoins-rolledback proof.
          assert_equal "prod diverged before rejoin" "$(state_ref prod)" "rollback/prod"
          rolledback_ver="$(state_version prod)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step5e-rollforward-run-id"
          gh workflow run promote.yaml -f mode=dev-to-prod -f dry_run=false
          conclusion="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "rollforward_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "roll-forward dev-to-prod conclusion" "${conclusion}" "success"
          # The promote finalize pushes prod's rejoin state commit moments after the
          # run reports success; poll until prod moves off the rolled-back version.
          i=0
          while [ "${i}" -lt 2 ]; do
            git fetch origin main --quiet
            git reset --hard origin/main >/dev/null
            cur="$(state_version prod)"
            if [ -n "${cur}" ] && [ "${cur}" != "${rolledback_ver}" ]; then
              break
            fi
            i=$((i + 1))
            sleep 60
          done
          after_ref="$(cascade status env prod --json | jq -r '.state.ref // empty')"
          after_base_sha="$(cascade status env prod --json | jq -r '.state.base_sha // empty')"
          assert_equal "prod rejoin clears ref" "${after_ref}" ""
          assert_equal "prod rejoin clears base_sha" "${after_base_sha}" ""
          summarize "5e roll-forward rejoin" "PASS" "prod rejoined, ref and base_sha cleared"

      - name: Register Step 5e roll-forward dev-to-prod run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step5e.outputs.rollforward_run_id }}
          expected-conclusion: success
          reason: step5e-rollforward-rejoin
          upload: 'true'

      - name: Step 5c - downgrade gate
        run: |
          set -euo pipefail
          # Exercises the monotonicity gate in internal/promote/preflight.go
          # checkDowngrade: a promotion whose incoming version sorts below the
          # target env's current version regresses that env and must be blocked
          # unless --allow-downgrade is set. This step probes the NON-prod error
          # variant by targeting `test`, which keeps it off the live prod
          # rollback divergence entirely.
          #
          # The probe runs `cascade promote preflight` directly against a
          # purpose-built manifest written to RUNNER_TEMP, so it is fully
          # deterministic and never dispatches a workflow or mutates trunk
          # state - the live manifest the Step 6 snapshot guards is untouched.
          # dev carries the lower version and test the higher, so a dev-to-test
          # cascade lands the lower version on test: a downgrade.
          high_ver="v0.2.0"
          low_ver="v0.1.0"
          probe="${RUNNER_TEMP}/downgrade-manifest.yaml"
          cat > "${probe}" <<PROBE
          ci:
            config:
              schema_version: 1
              trunk_branch: main
              manifest_file: ${probe}
              manifest_key: ci
              environments: [dev, test, staging, prod]
              builds:
                - name: app
                  workflow: .github/workflows/build-app.yaml
              deploys:
                - name: app
                  workflow: .github/workflows/deploy-app.yaml
            state:
              dev:
                version: ${low_ver}
                sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                deploys:
                  app:
                    sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              test:
                version: ${high_ver}
                sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                deploys:
                  app:
                    sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          PROBE

          # Blocked leg: default gate (--allow-downgrade=false) must fail and
          # print the non-prod downgrade error naming both versions.
          set +e
          blocked_out="$(cascade promote preflight \
            --mode dev-to-test --config "${probe}" --allow-downgrade=false 2>&1)"
          blocked_rc=$?
          set -e
          if [ "${blocked_rc}" -eq 0 ]; then
            echo "::error::downgrade preflight should have failed but exited 0"
            printf '%s\n' "${blocked_out}"
            exit 1
          fi
          echo "  ok: downgrade preflight blocked (exit ${blocked_rc})"
          expected_err="downgrade blocked on env \"test\": current version ${high_ver} is newer than incoming ${low_ver}; pass --allow-downgrade to permit"
          if ! printf '%s' "${blocked_out}" | grep -qF "${expected_err}"; then
            echo "::error::downgrade error text mismatch"
            echo "::error::want: ${expected_err}"
            printf 'got:\n%s\n' "${blocked_out}"
            exit 1
          fi
          echo "  ok: error names env, current (${high_ver}), incoming (${low_ver}), and --allow-downgrade"

          # Override leg: --allow-downgrade=true permits the promotion. Assert a
          # clean exit, can_proceed=true, and the permit warning naming both
          # versions, confirming the gate flips rather than silently passing.
          allowed_out="$(cascade promote preflight \
            --mode dev-to-test --config "${probe}" --allow-downgrade=true --json)"
          can_proceed="$(printf '%s' "${allowed_out}" | jq -r '.can_proceed')"
          assert_equal "downgrade permitted can_proceed" "${can_proceed}" "true"
          permit_warn="$(printf '%s' "${allowed_out}" \
            | jq -r '.warnings[]? | select(test("permitted via --allow-downgrade"))' | head -n1)"
          assert_equal "downgrade permit warning" "${permit_warn}" \
            "downgrade on test from ${high_ver} to ${low_ver} permitted via --allow-downgrade"
          summarize "5c downgrade gate" "PASS" "test ${high_ver}<-${low_ver} blocked by default, proceeds with --allow-downgrade"

      - name: Step 6 - dry-run promote dev to test
        id: step6
        run: |
          set -euo pipefail
          # Ensure the baseline reflects the landed prod rollback state before
          # capturing the snapshot the dry-run must leave untouched.
          sync_env_state prod
          before="$(full_snapshot)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step6-dryrun-run-id"
          gh workflow run promote.yaml -f mode=dev-to-test -f dry_run=true
          conclusion="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "dryrun_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "dry-run conclusion" "${conclusion}" "success"
          after="$(full_snapshot)"
          if [[ "${before}" == "${after}" ]]; then
            echo "  ok: dry-run left state, tags, and releases unchanged"
            summarize "6 dry-run" "PASS" "no state/tag/release mutation"
          else
            echo "::error::dry-run mutated the snapshot"
            diff <(printf '%s' "${before}") <(printf '%s' "${after}") || true
            exit 1
          fi

      - name: Register Step 6 dry-run promote run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step6.outputs.dryrun_run_id }}
          expected-conclusion: success
          reason: step6-dryrun-promote
          upload: 'true'

      - name: Step 7 - breaking change gate
        id: step7
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          # The breaking marker (`!`) MUST live in the commit subject: rebase
          # replays the branch commit onto main with its message intact, and
          # cascade detects the break from that subject's trailing `!`.
          merge_sha="$(seed_via_pr \
            src/breaking-marker.txt \
            "breaking marker ${stamp}" \
            "feat!: rework validation marker ${stamp}")"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step7-seed-orchestrate-run-id"
          orchestrate="$(wait_for_orchestrate_sha "${merge_sha}")"
          echo "seed_orchestrate_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          # Poll trunk until the re-seeded dev state commit lands so later reads
          # and the override promotion run against the current manifest.
          sync_env_state dev
          assert_equal "orchestrate after breaking change" "${orchestrate}" "success"

          # The breaking-change gate is scoped to the prerelease->release and
          # release->prod boundaries: only a promotion that TARGETS prod is
          # gated. First carry the breaking artifact up to staging (this hop is
          # ungated), so the subsequent staging-to-prod hop has the breaking
          # commit in staging but not in prod and the gate has something to act
          # on. dev-to-staging never targets prod, so it proceeds.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step7-carry-run-id"
          gh workflow run promote.yaml -f mode=dev-to-staging -f dry_run=false
          staged="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "carry_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "carry breaking change to staging" "${staged}" "success"
          sync_env_state staging

          # Gated leg: staging-to-prod targets prod and carries a breaking
          # change, so the preflight sets can_proceed=false and the workflow
          # fails. prod stays at its rolled-back version (this leg writes no
          # state), so no sync is needed before the override leg.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step7-gated-run-id"
          gh workflow run promote.yaml -f mode=staging-to-prod -f dry_run=false \
            -f allow_breaking_changes=false
          gated="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "gated_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          if [[ "${gated}" == "failure" ]]; then
            echo "  ok: promotion to prod blocked without allow_breaking_changes"
          else
            echo "::error::breaking promotion to prod should have failed but was ${gated}"
            exit 1
          fi

          # Override leg: the same hop with allow_breaking_changes=true proceeds,
          # publishing the breaking version to prod and rejoining it onto trunk.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step7-override-run-id"
          gh workflow run promote.yaml -f mode=staging-to-prod -f dry_run=false \
            -f allow_breaking_changes=true
          allowed="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "override_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "promotion proceeds with override" "${allowed}" "success"
          summarize "7 breaking gate" "PASS" "blocked targeting prod by default, proceeds with override"

      - name: Register Step 7 seed orchestrate (breaking) run
        if: steps.step7.outputs.seed_orchestrate_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step7.outputs.seed_orchestrate_run_id }}
          expected-conclusion: success
          reason: step7-seed-orchestrate-breaking
          upload: 'true'

      - name: Register Step 7 carry dev-to-staging run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step7.outputs.carry_run_id }}
          expected-conclusion: success
          reason: step7-carry-dev-to-staging
          upload: 'true'

      # NEGATIVE: the gated staging-to-prod leg MUST conclude failure (the
      # breaking-change gate refused it without an override). Registered
      # expected-conclusion: failure so reconcile accounts for it and a run that
      # wrongly SUCCEEDS reds the gate.
      - name: Register Step 7 breaking gate blocked run
        if: steps.step7.outputs.gated_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step7.outputs.gated_run_id }}
          expected-conclusion: failure
          reason: step7-breaking-gate-blocked
          upload: 'true'

      - name: Register Step 7 breaking override run
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step7.outputs.override_run_id }}
          expected-conclusion: success
          reason: step7-breaking-override
          upload: 'true'

      - name: Step 8 - status verbs readback
        run: |
          set -euo pipefail
          # Poll trunk until each env carries state before reading it back; the
          # override promotion in step 7 pushes test's state commit moments after
          # the run reports success.
          for e in dev test staging prod; do
            sync_env_state "${e}"
          done
          cascade status
          for e in dev test staging prod; do
            sha="$(state_sha "${e}")"
            ver="$(state_version "${e}")"
            echo "env ${e}: sha=${sha} version=${ver}"
            assert_match "${e} sha" "${sha}" "${SHA_RE}"
          done
          summarize "8 status verbs" "PASS" "status and status env read back for all envs"


      - name: Final snapshot
        if: always()
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### final state snapshot"
            echo ""
            echo '```'
            full_snapshot || echo "snapshot unavailable"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"


  probe_drift:
    name: Probe drift-check PR gate
    needs: [repin]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      # Source for the revalidation request, taken from the event payload via
      # env to avoid injecting payload text into shell scripts.
      REVALIDATE_SOURCE: ${{ github.event.client_payload.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.14.2
        with:
          version: ${{ inputs.cascade_version || 'v0.8.0' }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${REVALIDATE_SOURCE:-}" ]; then
            echo "Revalidation requested by: ${REVALIDATE_SOURCE}"
          fi

      # Shared helpers used by every assertion step. Sourced from $BASH_ENV so the
      # functions are available in later run blocks without re-declaring them.
      - name: Install assertion helpers
        run: |
          set -euo pipefail
          helpers="${RUNNER_TEMP}/helpers.sh"
          cat > "${helpers}" <<'HELPERS'
          # Read a state sub-key for an env from the manifest via the CLI.
          state_sha() {
            cascade status env "$1" --json | jq -r '.state.sha // empty'
          }
          state_version() {
            cascade status env "$1" --json | jq -r '.state.version // empty'
          }
          # Assert a value matches a regex, failing the step on mismatch.
          assert_match() {
            local label="$1" value="$2" pattern="$3"
            if [[ "${value}" =~ ${pattern} ]]; then
              echo "  ok: ${label} (${value}) matches ${pattern}"
            else
              echo "::error::${label} value '${value}' does not match ${pattern}"
              return 1
            fi
          }
          assert_equal() {
            local label="$1" got="$2" want="$3"
            if [[ "${got}" == "${want}" ]]; then
              echo "  ok: ${label} == ${want}"
            else
              echo "::error::${label} expected '${want}' got '${got}'"
              return 1
            fi
          }
          # Look up a release by tag and print its draft/prerelease/latest flags.
          release_flag() {
            gh release view "$1" --json "$2" --jq ".$2" 2>/dev/null || echo "missing"
          }
          # Snapshot all four env states plus tags and releases into one string so
          # dry-run steps can compare before and after.
          full_snapshot() {
            for e in dev test staging prod; do
              printf 'env:%s sha:%s ver:%s\n' "${e}" "$(state_sha "${e}")" "$(state_version "${e}")"
            done
            echo "tags:"
            git tag --sort=-creatordate
            echo "releases:"
            gh release list --json tagName,isDraft,isPrerelease,isLatest \
              --jq '.[] | "\(.tagName) draft=\(.isDraft) pre=\(.isPrerelease) latest=\(.isLatest)"' \
              | sort
          }
          # Bounded wait for a workflow_dispatch run that THIS suite triggered.
          # workflow_dispatch carries no merge commit to key on, so callers
          # capture a UTC timestamp immediately before `gh workflow run` and
          # pass it here. The run created at/after that timestamp is the one we
          # fired; we capture its databaseId and poll THAT exact run to
          # completion rather than grabbing the global newest run, which a
          # stale or concurrent dispatch could otherwise win. Prints the run
          # conclusion on success.
          wait_for_dispatched_run() {
            local wf="$1" since="$2" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                run_id="$(gh run list --workflow "${wf}" --created ">=${since}" \
                  --json databaseId,headBranch,status \
                  --jq '.[0].databaseId // empty')"
                # Expose the resolved run id to the caller (write once) so the
                # following register-run step can record it in the reconcile
                # ledger. Side channel only; stdout still carries the conclusion.
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for dispatched ${wf} run since ${since}"
            return 1
          }
          # Wait for the orchestrate run fired by a specific merge commit on main,
          # keyed on headSha so a stale or concurrent run is never mistaken for
          # this one. Prints the run conclusion on success.
          wait_for_orchestrate_sha() {
            local merge_sha="$1" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              run_id="$(gh run list --workflow orchestrate.yaml --branch main \
                --json databaseId,headSha,status \
                --jq ".[] | select(.headSha==\"${merge_sha}\") | .databaseId" \
                | head -n1)"
              # Expose the resolved orchestrate run id to the caller (write once)
              # so the following register-run step can record it in the reconcile
              # ledger. Side channel only; stdout still carries the conclusion.
              if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ] \
                && [ ! -s "${RESOLVED_RUN_ID_FILE}" ]; then
                echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for orchestrate run for ${merge_sha}"
            return 1
          }
          # Land a src/** change on main through a branch -> PR -> rebase-merge.
          # Rebase replays the branch commit onto main and preserves its
          # github-actions[bot] author. The commit message carries the
          # conventional type. Prints the merge commit SHA on origin/main.
          seed_via_pr() {
            local file="$1" content="$2" title="$3" branch sha
            branch="scenario/src-$(date +%s)-${RANDOM}"
            # Route all command chatter to stderr so the function's stdout is
            # ONLY the merge SHA (callers capture it via command substitution).
            {
              git fetch origin main --quiet
              git checkout -B "${branch}" origin/main
              mkdir -p src
              printf '%s\n' "${content}" > "${file}"
              git add "${file}"
              git commit --no-gpg-sign -s -m "${title}"
              git push origin "${branch}"
              gh pr create --base main --head "${branch}" \
                --title "${title}" \
                --body "Automated scenario run; drives orchestrate on merge."
              gh pr merge "${branch}" --rebase --delete-branch
              git fetch origin main --quiet
            } >&2
            sha="$(git rev-parse origin/main)"
            printf '%s\n' "${sha}"
          }
          # Refresh local trunk and poll until the named env carries a version.
          # cascade's finalize job pushes the "update state" commit to main a
          # few seconds after the orchestrate/promote run reports success, so a
          # single fetch+reset can read the pre-state-commit manifest. Re-fetch
          # trunk and re-read until the env is populated (up to ~60s).
          sync_env_state() {
            local env="$1" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_version "${env}")" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} state to land on trunk"
            return 1
          }
          # Like sync_env_state, but poll until the env's sha differs from a
          # known prior value. A rollback re-writes an env that ALREADY carries
          # a version, so a plain non-empty poll returns the stale pre-rollback
          # state immediately. Pass the pre-rollback sha and wait for the
          # finalize state commit that actually changes it.
          sync_env_state_until_sha_changed() {
            local env="$1" prior_sha="$2" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_sha "${env}")" ] && [ "$(state_sha "${env}")" != "${prior_sha}" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} sha to change from ${prior_sha} on trunk"
            return 1
          }
          # Read the divergence ref an env carries (set to rollback/<env> after a
          # manual rollback, empty on the linear promotion line).
          state_ref() {
            cascade status env "$1" --json | jq -r '.state.ref // empty'
          }
          # Force the remote env/<env> branch tip back to that env's OWN recorded
          # state.<env>.sha. cascade's contract is that env/<env> tip always
          # equals recorded state, and the hotfix planner derives its cherry-pick
          # base from recorded state and fail-closes when a live env tip has
          # drifted. This repo's env/* branches are shared across the suite's
          # parallel jobs, so a sibling job's seed can leave a stale tip behind;
          # resetting to the recorded SHA clears that residue deterministically
          # WITHOUT recreating any divergence. Requires GH_TOKEN (admin PAT) in
          # the step env to bypass branch protection. In-suite git only, no GPG.
          reset_env_to_recorded() {
            local env="$1" e_sha push_remote
            git fetch origin main --quiet
            e_sha="$(state_sha "${env}")"
