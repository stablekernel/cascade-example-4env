          echo "BASH_ENV=${helpers}" >> "${GITHUB_ENV}"
          {
            echo "## scenario-suite results"
            echo ""
            echo "| step | result | detail |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"


      # ===================================================================
      # Step 9 - workflow drift-check PR gate (#316)
      # The repo manifest opts into drift_check (enabled + comment), so the
      # fleet repin emits cascade-drift-check.yaml (pull_request, read-only,
      # re-exits on drift) and cascade-drift-comment.yaml (workflow_run
      # companion that posts a sticky <!-- cascade-drift-check --> comment).
      # This step opens a PR that mutates a committed generated workflow so the
      # drift digest diverges: the Cascade Drift Check run on that PR MUST
      # conclude failure and the sticky comment MUST land. A second PR that
      # touches only a non-generated path leaves the committed workflows in
      # sync, so its drift-check run MUST conclude success (the re-exit / no-drift
      # path). Both runs are pull_request-triggered (the lane carries no dispatch
      # trigger), so each is resolved by its PR head branch and registered.
      - name: Step 9 - drift-check PR gate (diverged + clean)
        id: step9
        run: |
          set -euo pipefail
          # Resolve the drift-check run for a given PR head branch. The lane
          # fires on pull_request, so key on the head branch and the
          # pull_request event, poll to completion, and print the conclusion.
          wait_for_drift_run() {
            local head="$1" since="$2" attempts=40 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                # Resolve by identity, not position: among the pull_request runs
                # on this head branch, take the EARLIEST created at or after the
                # moment this probe opened its PR. That excludes any stale prior
                # run on a recycled branch under concurrent fleet load, and an
                # empty list just means the run has not appeared yet, so keep
                # polling rather than failing fast.
                run_id="$(gh run list --workflow cascade-drift-check.yaml \
                  --branch "${head}" --event pull_request \
                  --json databaseId,createdAt 2>/dev/null \
                  | jq -r --arg since "${since}" \
                      '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | .[0].databaseId // empty' \
                      2>/dev/null || echo "")"
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 30
            done
            echo "::error::timed out waiting for drift-check run on ${head}"
            return 1
          }

          # Diverged PR: mutate a committed generated workflow so verify reports
          # drift. The PR is NOT merged (it only needs to trigger the gate); it
          # is closed after the assertion so trunk stays clean.
          git fetch origin main --quiet
          diverged_branch="scenario/drift-diverged-$(date +%s)-${RANDOM}"
          git checkout -B "${diverged_branch}" origin/main
          printf '\n# drift probe %s\n' "$(date -u +%FT%TWZ)" >> .github/workflows/orchestrate.yaml
          git add .github/workflows/orchestrate.yaml
          git commit --no-gpg-sign -s -m "test: perturb generated workflow to diverge drift digest"
          git push origin "${diverged_branch}"
          # Anchor the run search to now so the resolver keys on the run THIS PR
          # triggers, never a stale prior run on a recycled head branch.
          diverged_since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh pr create --base main --head "${diverged_branch}" \
            --title "test: drift-check diverged probe" \
            --body "Mutates a generated workflow so the drift gate must fail. Not for merge."
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step9-drift-diverged-run-id"
          diverged_concl="$(wait_for_drift_run "${diverged_branch}" "${diverged_since}")"
          echo "drift_diverged_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "diverged drift-check conclusion" "${diverged_concl}" "failure"

          # The fork-safe comment companion posts a sticky comment on the PR.
          # Poll the PR for the marker, then close the PR and delete the branch.
          marker="<!-- cascade-drift-check -->"
          found="no"
          for _ in $(seq 1 10); do
            if gh pr view "${diverged_branch}" --json comments \
              --jq '.comments[].body' 2>/dev/null | grep -qF "${marker}"; then
              found="yes"
              break
            fi
            sleep 30
          done
          assert_equal "drift sticky comment present" "${found}" "yes"
          gh pr close "${diverged_branch}" --delete-branch || true

          # Clean PR: touch a non-generated path only, so the committed
          # generated workflows still match the manifest and the gate passes.
          git fetch origin main --quiet
          clean_branch="scenario/drift-clean-$(date +%s)-${RANDOM}"
          git checkout -B "${clean_branch}" origin/main
          mkdir -p src
          printf 'drift clean probe %s\n' "$(date -u +%FT%TWZ)" > src/drift-clean-probe.txt
          git add src/drift-clean-probe.txt
          git commit --no-gpg-sign -s -m "test: non-generated change leaves workflows in sync"
          git push origin "${clean_branch}"
          clean_since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh pr create --base main --head "${clean_branch}" \
            --title "test: drift-check clean probe" \
            --body "Touches only a non-generated path so the drift gate must pass. Not for merge."
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step9-drift-clean-run-id"
          clean_concl="$(wait_for_drift_run "${clean_branch}" "${clean_since}")"
          echo "drift_clean_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "clean drift-check conclusion" "${clean_concl}" "success"
          gh pr close "${clean_branch}" --delete-branch || true
          summarize "9 drift-check gate" "PASS" "diverged PR failed + commented; clean PR passed"

      # NEGATIVE: the diverged PR's drift-check MUST conclude failure (verify
      # re-exits on drift to keep the gate red). Registered expected failure so
      # reconcile accounts for it and a run that wrongly SUCCEEDS reds the gate.
      - name: Register Step 9 diverged drift-check run
        if: steps.step9.outputs.drift_diverged_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step9.outputs.drift_diverged_run_id }}
          expected-conclusion: failure
          reason: step9-drift-diverged
          upload: 'true'

      - name: Register Step 9 clean drift-check run
        if: steps.step9.outputs.drift_clean_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step9.outputs.drift_clean_run_id }}
          expected-conclusion: success
          reason: step9-drift-clean
          upload: 'true'


