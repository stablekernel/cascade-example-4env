                  printf 'gh: giving up after %d attempts (exit %d)\n' "$attempt" "$rc" >&2
                fi
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          HELPERS
          echo "BASH_ENV=${helpers}" >> "${GITHUB_ENV}"
          {
            echo "## scenario-suite results"
            echo ""
            echo "| step | result | detail |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"


      # ===================================================================
      # Step 10 - validate-manifest PR gate (#318)
      # The manifest opts into validate_check, so cascade-validate.yaml runs on
      # any pull_request touching .github/manifest.yaml and fails when the
      # manifest is invalid. An invalid-manifest PR (an unknown environment)
      # MUST conclude failure; a valid control PR MUST conclude success. Both
      # are pull_request-triggered (the lane carries no dispatch trigger), so
      # each is resolved by its PR head branch and registered. Because 4env
      # opts into drift_check, each manifest-touching PR ALSO fires the
      # drift-check lane, so the suite resolves and registers the drift-check
      # run each PR triggers too (invalid manifest cannot regenerate matching
      # workflows so its drift-check fails; the comment-only control keeps it
      # green). Neither PR is merged; the gate only evaluates the PR head.
      - name: Step 10 - validate-manifest PR gate (invalid + valid)
        id: step10
        run: |
          set -euo pipefail
          wait_for_validate_run() {
            local head="$1" since="$2" attempts=40 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                # Resolve by identity, not position (see the drift resolver): take
                # the EARLIEST pull_request run on this head created at or after
                # the PR opened, so concurrent fleet load cannot latch a stale run
                # and an empty list just means the run has not appeared yet.
                run_id="$(gh run list --workflow cascade-validate.yaml \
                  --branch "${head}" --event pull_request \
                  --json databaseId,createdAt 2>/dev/null \
                  | jq -r --arg since "${since}" \
                      '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | .[0].databaseId // empty' \
                      2>/dev/null || echo "")"
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 30
            done
            echo "::error::timed out waiting for validate run on ${head}"
            return 1
          }

          # Both manifest-touching PRs below also fire the drift-check lane
          # (4env opts into drift_check), so the suite must account for the
          # drift-check run each PR triggers. Resolve it the same way: key on
          # the PR head branch and the pull_request event, poll to completion,
          # and print the conclusion.
          wait_for_drift_run() {
            local head="$1" since="$2" attempts=40 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                # Resolve by identity, not position: among the pull_request runs
                # on this head branch, take the EARLIEST created at or after the
                # moment this probe opened its PR. That excludes any stale prior
                # run on a recycled branch under concurrent fleet load, and an
                # empty list just means the run has not appeared yet, so keep
                # polling rather than failing fast.
                run_id="$(gh run list --workflow cascade-drift-check.yaml \
                  --branch "${head}" --event pull_request \
                  --json databaseId,createdAt 2>/dev/null \
                  | jq -r --arg since "${since}" \
                      '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | .[0].databaseId // empty' \
                      2>/dev/null || echo "")"
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 30
            done
            echo "::error::timed out waiting for drift-check run on ${head}"
            return 1
          }

          # Invalid PR: empty a required field on an existing deploy so
          # parse-config reports the manifest invalid (deploys[0].name is
          # required). The change targets .github/manifest.yaml so the path
          # filter fires the gate.
          git fetch origin main --quiet
          bad_branch="scenario/validate-invalid-$(date +%s)-${RANDOM}"
          git checkout -B "${bad_branch}" origin/main
          # Blanking the first deploy's required name makes parse-config emit
          # valid:false with "deploys[0].name is required", so the gate fails
          # deterministically. (An empty env-list entry is accepted, so it must
          # not be used here.)
          yq -i '.ci.config.deploys[0].name = ""' .github/manifest.yaml
          git add .github/manifest.yaml
          git commit --no-gpg-sign -s -m "test: break manifest so validate gate must fail"
          git push origin "${bad_branch}"
          # Anchor both the validate and drift resolvers to the moment this PR
          # opens, so each keys on the run THIS PR triggers, not a stale one.
          bad_since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh pr create --base main --head "${bad_branch}" \
            --title "test: invalid manifest probe" \
            --body "Breaks the manifest so the validate gate must fail. Not for merge."
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step10-validate-invalid-run-id"
          bad_concl="$(wait_for_validate_run "${bad_branch}" "${bad_since}")"
          echo "validate_invalid_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "invalid-manifest validate conclusion" "${bad_concl}" "failure"
          # The same invalid-manifest PR also fires the drift-check lane, which
          # cannot regenerate matching workflows from an invalid manifest, so it
          # MUST conclude failure. Resolve and wait for it BEFORE deleting the
          # branch (a branch delete cancels an in-flight run, and a cancelled
          # run with no superseder also reds reconcile). The following step
          # registers it expected failure so the run the probe caused is
          # accounted for.
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step10-drift-invalid-run-id"
          bad_drift_concl="$(wait_for_drift_run "${bad_branch}" "${bad_since}")"
          echo "drift_invalid_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "invalid-manifest drift-check conclusion" "${bad_drift_concl}" "failure"
          gh pr close "${bad_branch}" --delete-branch || true
          # Restore the local checkout so the control PR builds on a clean trunk.
          git checkout -- .github/manifest.yaml 2>/dev/null || true
          git fetch origin main --quiet
          git reset --hard origin/main >/dev/null

          # Valid PR: a manifest-touching but still-valid change (a no-op
          # comment edit) so the gate passes.
          good_branch="scenario/validate-valid-$(date +%s)-${RANDOM}"
          git checkout -B "${good_branch}" origin/main
          printf '\n# validate control probe %s\n' "$(date -u +%FT%TWZ)" >> .github/manifest.yaml
          git add .github/manifest.yaml
          git commit --no-gpg-sign -s -m "test: valid manifest comment leaves validate gate green"
          git push origin "${good_branch}"
          good_since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh pr create --base main --head "${good_branch}" \
            --title "test: valid manifest control" \
            --body "Valid manifest change so the validate gate must pass. Not for merge."
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step10-validate-valid-run-id"
          good_concl="$(wait_for_validate_run "${good_branch}" "${good_since}")"
          echo "validate_valid_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "valid-manifest validate conclusion" "${good_concl}" "success"
          # The valid control PR also fires the drift-check lane, but a
          # comment-only manifest edit regenerates identical workflows, so it
          # MUST conclude success. Resolve and wait for it BEFORE deleting the
          # branch so the delete cannot cancel it, then register it expected
          # success so the run the probe caused is accounted for.
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step10-drift-valid-run-id"
          good_drift_concl="$(wait_for_drift_run "${good_branch}" "${good_since}")"
          echo "drift_valid_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "valid-manifest drift-check conclusion" "${good_drift_concl}" "success"
          gh pr close "${good_branch}" --delete-branch || true
          git fetch origin main --quiet
          git reset --hard origin/main >/dev/null
          summarize "10 validate gate" "PASS" "invalid PR failed; valid control passed"

      # NEGATIVE: the invalid-manifest PR's validate run MUST conclude failure.
      # Registered expected failure so reconcile accounts for it and a run that
      # wrongly SUCCEEDS reds the gate.
      - name: Register Step 10 invalid-manifest validate run
        if: steps.step10.outputs.validate_invalid_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step10.outputs.validate_invalid_run_id }}
          expected-conclusion: failure
          reason: step10-validate-invalid
          upload: 'true'

      - name: Register Step 10 valid-manifest validate run
        if: steps.step10.outputs.validate_valid_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step10.outputs.validate_valid_run_id }}
          expected-conclusion: success
          reason: step10-validate-valid
          upload: 'true'

      # NEGATIVE: the invalid-manifest PR's drift-check run MUST conclude
      # failure (cascade cannot regenerate matching workflows from an invalid
      # manifest). Registered expected failure so reconcile accounts for the
      # incidental drift-check run instead of fail-closing on it.
      - name: Register Step 10 invalid-manifest drift-check run
        if: steps.step10.outputs.drift_invalid_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step10.outputs.drift_invalid_run_id }}
          expected-conclusion: failure
          reason: step10-drift-invalid
          upload: 'true'

      # The valid control PR's drift-check run MUST conclude success (the
      # comment-only manifest edit regenerates identical workflows). Registered
      # so the run is accounted for and a wrongly-failing drift-check reds the
      # gate.
      - name: Register Step 10 valid-manifest drift-check run
        if: steps.step10.outputs.drift_valid_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step10.outputs.drift_valid_run_id }}
          expected-conclusion: success
          reason: step10-drift-valid
          upload: 'true'


  probe_rollback:
    name: Probe rollback variants
    needs: [lifecycle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      # Source for the revalidation request, taken from the event payload via
      # env to avoid injecting payload text into shell scripts.
      REVALIDATE_SOURCE: ${{ github.event.client_payload.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.14.2
        with:
          version: ${{ inputs.cascade_version || 'v0.8.0' }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${REVALIDATE_SOURCE:-}" ]; then
            echo "Revalidation requested by: ${REVALIDATE_SOURCE}"
          fi

      # Shared helpers used by every assertion step. Sourced from $BASH_ENV so the
      # functions are available in later run blocks without re-declaring them.
      - name: Install assertion helpers
        run: |
          set -euo pipefail
          helpers="${RUNNER_TEMP}/helpers.sh"
          cat > "${helpers}" <<'HELPERS'
          # Read a state sub-key for an env from the manifest via the CLI.
          state_sha() {
            cascade status env "$1" --json | jq -r '.state.sha // empty'
          }
          state_version() {
            cascade status env "$1" --json | jq -r '.state.version // empty'
          }
          # Assert a value matches a regex, failing the step on mismatch.
          assert_match() {
            local label="$1" value="$2" pattern="$3"
            if [[ "${value}" =~ ${pattern} ]]; then
              echo "  ok: ${label} (${value}) matches ${pattern}"
            else
              echo "::error::${label} value '${value}' does not match ${pattern}"
              return 1
            fi
          }
          assert_equal() {
            local label="$1" got="$2" want="$3"
            if [[ "${got}" == "${want}" ]]; then
              echo "  ok: ${label} == ${want}"
            else
              echo "::error::${label} expected '${want}' got '${got}'"
              return 1
            fi
          }
          # Look up a release by tag and print its draft/prerelease/latest flags.
          release_flag() {
            gh release view "$1" --json "$2" --jq ".$2" 2>/dev/null || echo "missing"
          }
          # Snapshot all four env states plus tags and releases into one string so
          # dry-run steps can compare before and after.
          full_snapshot() {
            for e in dev test staging prod; do
              printf 'env:%s sha:%s ver:%s\n' "${e}" "$(state_sha "${e}")" "$(state_version "${e}")"
            done
            echo "tags:"
            git tag --sort=-creatordate
            echo "releases:"
            gh release list --json tagName,isDraft,isPrerelease,isLatest \
              --jq '.[] | "\(.tagName) draft=\(.isDraft) pre=\(.isPrerelease) latest=\(.isLatest)"' \
              | sort
          }
          # Bounded wait for a workflow_dispatch run that THIS suite triggered.
          # workflow_dispatch carries no merge commit to key on, so callers
          # capture a UTC timestamp immediately before `gh workflow run` and
          # pass it here. The run created at/after that timestamp is the one we
          # fired; we capture its databaseId and poll THAT exact run to
          # completion rather than grabbing the global newest run, which a
          # stale or concurrent dispatch could otherwise win. Prints the run
          # conclusion on success.
          wait_for_dispatched_run() {
            local wf="$1" since="$2" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                run_id="$(gh run list --workflow "${wf}" --created ">=${since}" \
                  --json databaseId,headBranch,status \
                  --jq '.[0].databaseId // empty')"
                # Expose the resolved run id to the caller (write once) so the
                # following register-run step can record it in the reconcile
                # ledger. Side channel only; stdout still carries the conclusion.
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for dispatched ${wf} run since ${since}"
            return 1
          }
          # Wait for the orchestrate run fired by a specific merge commit on main,
          # keyed on headSha so a stale or concurrent run is never mistaken for
          # this one. Prints the run conclusion on success.
          wait_for_orchestrate_sha() {
            local merge_sha="$1" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              run_id="$(gh run list --workflow orchestrate.yaml --branch main \
                --json databaseId,headSha,status \
                --jq ".[] | select(.headSha==\"${merge_sha}\") | .databaseId" \
                | head -n1)"
              # Expose the resolved orchestrate run id to the caller (write once)
              # so the following register-run step can record it in the reconcile
              # ledger. Side channel only; stdout still carries the conclusion.
              if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ] \
                && [ ! -s "${RESOLVED_RUN_ID_FILE}" ]; then
                echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for orchestrate run for ${merge_sha}"
            return 1
          }
          # Land a src/** change on main through a branch -> PR -> rebase-merge.
          # Rebase replays the branch commit onto main and preserves its
          # github-actions[bot] author. The commit message carries the
          # conventional type. Prints the merge commit SHA on origin/main.
          seed_via_pr() {
            local file="$1" content="$2" title="$3" branch sha
            branch="scenario/src-$(date +%s)-${RANDOM}"
            # Route all command chatter to stderr so the function's stdout is
            # ONLY the merge SHA (callers capture it via command substitution).
            {
              git fetch origin main --quiet
              git checkout -B "${branch}" origin/main
              mkdir -p src
              printf '%s\n' "${content}" > "${file}"
              git add "${file}"
              git commit --no-gpg-sign -s -m "${title}"
              git push origin "${branch}"
              gh pr create --base main --head "${branch}" \
                --title "${title}" \
                --body "Automated scenario run; drives orchestrate on merge."
              gh pr merge "${branch}" --rebase --delete-branch
              git fetch origin main --quiet
            } >&2
            sha="$(git rev-parse origin/main)"
            printf '%s\n' "${sha}"
          }
          # Refresh local trunk and poll until the named env carries a version.
          # cascade's finalize job pushes the "update state" commit to main a
          # few seconds after the orchestrate/promote run reports success, so a
          # single fetch+reset can read the pre-state-commit manifest. Re-fetch
          # trunk and re-read until the env is populated (up to ~60s).
          sync_env_state() {
            local env="$1" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_version "${env}")" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} state to land on trunk"
            return 1
          }
          # Like sync_env_state, but poll until the env's sha differs from a
          # known prior value. A rollback re-writes an env that ALREADY carries
          # a version, so a plain non-empty poll returns the stale pre-rollback
          # state immediately. Pass the pre-rollback sha and wait for the
          # finalize state commit that actually changes it.
          sync_env_state_until_sha_changed() {
            local env="$1" prior_sha="$2" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_sha "${env}")" ] && [ "$(state_sha "${env}")" != "${prior_sha}" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} sha to change from ${prior_sha} on trunk"
            return 1
          }
          # Read the divergence ref an env carries (set to rollback/<env> after a
          # manual rollback, empty on the linear promotion line).
          state_ref() {
            cascade status env "$1" --json | jq -r '.state.ref // empty'
          }
          # Force the remote env/<env> branch tip back to that env's OWN recorded
          # state.<env>.sha. cascade's contract is that env/<env> tip always
          # equals recorded state, and the hotfix planner derives its cherry-pick
          # base from recorded state and fail-closes when a live env tip has
          # drifted. This repo's env/* branches are shared across the suite's
          # parallel jobs, so a sibling job's seed can leave a stale tip behind;
          # resetting to the recorded SHA clears that residue deterministically
          # WITHOUT recreating any divergence. Requires GH_TOKEN (admin PAT) in
          # the step env to bypass branch protection. In-suite git only, no GPG.
          reset_env_to_recorded() {
            local env="$1" e_sha push_remote
            git fetch origin main --quiet
            e_sha="$(state_sha "${env}")"
            [ -n "${e_sha}" ] \
              || { echo "::error::cannot reset env/${env}: recorded state SHA empty"; return 1; }
            push_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force "${push_remote}" "${e_sha}:refs/heads/env/${env}" \
              || { echo "::error::failed to reset env/${env} to recorded state"; return 1; }
          }
          # Close any open cascade-hotfix / cascade-hotfix-conflict PR before a
          # hotfix stage dispatches. The generated plan job passes --repo, which
          # arms the single-flight gate: it aborts a fresh hotfix while an open
          # hotfix PR already targets the env. A prior run that ended mid-hotfix
          # can strand such a PR, so close each one and drop its head branch to
          # normalize state. Scoped to the two hotfix labels; other open PRs are
          # left untouched.
          close_open_hotfix_prs() {
            local label num
            for label in cascade-hotfix cascade-hotfix-conflict; do
              for num in $(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
                --label "${label}" --json number --jq '.[].number' 2>/dev/null || true); do
                gh pr close "${num}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                  && echo "closed stale ${label} PR #${num}" \
                  || echo "::warning::could not close ${label} PR #${num}"
              done
            done
          }
          # Append a PASS/FAIL row to the job summary table.
          summarize() {
            printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "${GITHUB_STEP_SUMMARY}"
          }
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                if [ "$attempt" -gt 1 ]; then
                  printf 'gh: giving up after %d attempts (exit %d)\n' "$attempt" "$rc" >&2
                fi
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          HELPERS
          echo "BASH_ENV=${helpers}" >> "${GITHUB_ENV}"
          {
            echo "## scenario-suite results"
            echo ""
            echo "| step | result | detail |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"


      # ===================================================================
      # Step 11 - rollback variants (#321)
      # The generated Rollback workflow exposes dry_run and deployable inputs.
      # (a) A dry-run rollback resolves and prints without deploying and writes
      #     NO state - it MUST conclude success and leave prod's state byte for
      #     byte unchanged. (b) A deployable-scoped rollback limits the deploy to
      #     a single deployable (app), exercising the default-deployable path -
      #     it MUST conclude success and the only deploy job that ran is the app
      #     deploy. Each dispatched run is registered. The cascade-rollback lane
      #     carries no repository_dispatch trigger in this repo's generated set,
      #     so the repository_dispatch rollback variant is not wireable here and
      #     is noted in the PR body rather than faked.
      - name: Step 11 - rollback dry-run and deployable-scoped
        id: step11
        run: |
          set -euo pipefail
          for e in dev prod; do sync_env_state "${e}"; done
          before_ver="$(state_version prod)"
          before_sha="$(state_sha prod)"
          before_ref="$(state_ref prod)"

          # (a) Dry-run rollback: resolves and prints, writes no state.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step11-dryrun-run-id"
          gh workflow run cascade-rollback.yaml -f environment=prod -f dry_run=true
          dry_concl="$(wait_for_dispatched_run cascade-rollback.yaml "${ts}")"
          echo "rollback_dryrun_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "dry-run rollback conclusion" "${dry_concl}" "success"
          git fetch origin main --quiet
          git reset --hard origin/main >/dev/null
          assert_equal "dry-run rollback leaves prod version" "$(state_version prod)" "${before_ver}"
          assert_equal "dry-run rollback leaves prod sha" "$(state_sha prod)" "${before_sha}"
          assert_equal "dry-run rollback leaves prod ref" "$(state_ref prod)" "${before_ref}"

          # (b) Deployable-scoped rollback: scope the rollback to the app
          # deployable. The run drives the app deploy job only (the workflow's
          # deploy-app job gates on deployable in {'', app}); assert the
          # resolved run's job set carries the app deploy and concludes success.
          cur_sha="$(state_sha prod)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step11-scoped-run-id"
          gh workflow run cascade-rollback.yaml \
            -f environment=prod -f deployable=app -f dry_run=false
          scoped_concl="$(wait_for_dispatched_run cascade-rollback.yaml "${ts}")"
          scoped_run_id="$(cat "${RESOLVED_RUN_ID_FILE}")"
          echo "rollback_scoped_run_id=${scoped_run_id}" >> "${GITHUB_OUTPUT}"
          assert_equal "deployable-scoped rollback conclusion" "${scoped_concl}" "success"
          jobs_json="$(gh run view "${scoped_run_id}" --json jobs \
            --jq '[.jobs[].name]' 2>/dev/null || echo '[]')"
          echo "scoped rollback jobs: ${jobs_json}"
          if echo "${jobs_json}" | grep -qiE 'deploy'; then
            echo "  ok: deployable-scoped rollback ran a deploy job"
          else
            echo "::error::deployable-scoped rollback ran no deploy job: ${jobs_json}"
            exit 1
          fi
          # The scoped rollback re-wrote prod; sync forward so later steps read
          # the post-rollback state rather than racing the finalize commit.
          sync_env_state_until_sha_changed prod "${cur_sha}" || true
          summarize "11 rollback variants" "PASS" "dry-run wrote no state; scoped ran app deploy"

      - name: Register Step 11 dry-run rollback run
        if: steps.step11.outputs.rollback_dryrun_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step11.outputs.rollback_dryrun_run_id }}
          expected-conclusion: success
          reason: step11-rollback-dry-run
          upload: 'true'

      - name: Register Step 11 deployable-scoped rollback run
        if: steps.step11.outputs.rollback_scoped_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step11.outputs.rollback_scoped_run_id }}
          expected-conclusion: success
          reason: step11-rollback-deployable-scoped
          upload: 'true'


  probe_concurrency:
    name: Probe concurrency-cancel and no-change skip
    needs: [probe_rollback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      # Source for the revalidation request, taken from the event payload via
      # env to avoid injecting payload text into shell scripts.
      REVALIDATE_SOURCE: ${{ github.event.client_payload.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.14.2
        with:
          version: ${{ inputs.cascade_version || 'v0.8.0' }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${REVALIDATE_SOURCE:-}" ]; then
