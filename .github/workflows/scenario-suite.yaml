          # fired; we capture its databaseId and poll THAT exact run to
          # completion rather than grabbing the global newest run, which a
          # stale or concurrent dispatch could otherwise win. Prints the run
          # conclusion on success.
          wait_for_dispatched_run() {
            local wf="$1" since="$2" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                run_id="$(gh run list --workflow "${wf}" --created ">=${since}" \
                  --json databaseId,headBranch,status \
                  --jq '.[0].databaseId // empty')"
                # Expose the resolved run id to the caller (write once) so the
                # following register-run step can record it in the reconcile
                # ledger. Side channel only; stdout still carries the conclusion.
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for dispatched ${wf} run since ${since}"
            return 1
          }
          # Wait for the orchestrate run fired by a specific merge commit on main,
          # keyed on headSha so a stale or concurrent run is never mistaken for
          # this one. Prints the run conclusion on success.
          wait_for_orchestrate_sha() {
            local merge_sha="$1" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              run_id="$(gh run list --workflow orchestrate.yaml --branch main \
                --json databaseId,headSha,status \
                --jq ".[] | select(.headSha==\"${merge_sha}\") | .databaseId" \
                | head -n1)"
              # Expose the resolved orchestrate run id to the caller (write once)
              # so the following register-run step can record it in the reconcile
              # ledger. Side channel only; stdout still carries the conclusion.
              if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ] \
                && [ ! -s "${RESOLVED_RUN_ID_FILE}" ]; then
                echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for orchestrate run for ${merge_sha}"
            return 1
          }
          # Land a src/** change on main through a branch -> PR -> rebase-merge.
          # Rebase replays the branch commit onto main and preserves its
          # github-actions[bot] author. The commit message carries the
          # conventional type. Prints the merge commit SHA on origin/main.
          seed_via_pr() {
            local file="$1" content="$2" title="$3" branch sha
            branch="scenario/src-$(date +%s)-${RANDOM}"
            # Route all command chatter to stderr so the function's stdout is
            # ONLY the merge SHA (callers capture it via command substitution).
            {
              git fetch origin main --quiet
              git checkout -B "${branch}" origin/main
              mkdir -p src
              printf '%s\n' "${content}" > "${file}"
              git add "${file}"
              git commit --no-gpg-sign -s -m "${title}"
              git push origin "${branch}"
              gh pr create --base main --head "${branch}" \
                --title "${title}" \
                --body "Automated scenario run; drives orchestrate on merge."
              gh pr merge "${branch}" --rebase --delete-branch
              git fetch origin main --quiet
            } >&2
            sha="$(git rev-parse origin/main)"
            printf '%s\n' "${sha}"
          }
          # Refresh local trunk and poll until the named env carries a version.
          # cascade's finalize job pushes the "update state" commit to main a
          # few seconds after the orchestrate/promote run reports success, so a
          # single fetch+reset can read the pre-state-commit manifest. Re-fetch
          # trunk and re-read until the env is populated (up to ~60s).
          sync_env_state() {
            local env="$1" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_version "${env}")" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} state to land on trunk"
            return 1
          }
          # Like sync_env_state, but poll until the env's sha differs from a
          # known prior value. A rollback re-writes an env that ALREADY carries
          # a version, so a plain non-empty poll returns the stale pre-rollback
          # state immediately. Pass the pre-rollback sha and wait for the
          # finalize state commit that actually changes it.
          sync_env_state_until_sha_changed() {
            local env="$1" prior_sha="$2" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_sha "${env}")" ] && [ "$(state_sha "${env}")" != "${prior_sha}" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} sha to change from ${prior_sha} on trunk"
            return 1
          }
          # Read the divergence ref an env carries (set to rollback/<env> after a
          # manual rollback, empty on the linear promotion line).
          state_ref() {
            cascade status env "$1" --json | jq -r '.state.ref // empty'
          }
          # Force the remote env/<env> branch tip back to that env's OWN recorded
          # state.<env>.sha. cascade's contract is that env/<env> tip always
          # equals recorded state, and the hotfix planner derives its cherry-pick
          # base from recorded state and fail-closes when a live env tip has
          # drifted. This repo's env/* branches are shared across the suite's
          # parallel jobs, so a sibling job's seed can leave a stale tip behind;
          # resetting to the recorded SHA clears that residue deterministically
          # WITHOUT recreating any divergence. Requires GH_TOKEN (admin PAT) in
          # the step env to bypass branch protection. In-suite git only, no GPG.
          reset_env_to_recorded() {
            local env="$1" e_sha push_remote
            git fetch origin main --quiet
            e_sha="$(state_sha "${env}")"
            [ -n "${e_sha}" ] \
              || { echo "::error::cannot reset env/${env}: recorded state SHA empty"; return 1; }
            push_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force "${push_remote}" "${e_sha}:refs/heads/env/${env}" \
              || { echo "::error::failed to reset env/${env} to recorded state"; return 1; }
          }
          # Close any open cascade-hotfix / cascade-hotfix-conflict PR before a
          # hotfix stage dispatches. The generated plan job passes --repo, which
          # arms the single-flight gate: it aborts a fresh hotfix while an open
          # hotfix PR already targets the env. A prior run that ended mid-hotfix
          # can strand such a PR, so close each one and drop its head branch to
          # normalize state. Scoped to the two hotfix labels; other open PRs are
          # left untouched.
          close_open_hotfix_prs() {
            local label num
            for label in cascade-hotfix cascade-hotfix-conflict; do
              for num in $(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
                --label "${label}" --json number --jq '.[].number' 2>/dev/null || true); do
                gh pr close "${num}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                  && echo "closed stale ${label} PR #${num}" \
                  || echo "::warning::could not close ${label} PR #${num}"
              done
            done
          }
          # Append a PASS/FAIL row to the job summary table.
          summarize() {
            printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "${GITHUB_STEP_SUMMARY}"
          }
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                if [ "$attempt" -gt 1 ]; then
                  printf 'gh: giving up after %d attempts (exit %d)\n' "$attempt" "$rc" >&2
                fi
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          HELPERS
          echo "BASH_ENV=${helpers}" >> "${GITHUB_ENV}"
          {
            echo "## scenario-suite results"
            echo ""
            echo "| step | result | detail |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"


      # ===================================================================
      # Step 13 - hotfix cherry-pick conflict (#334)
      # 4env is multi-env, so cascade emits cascade-hotfix.yaml. The apply job
      # cuts its hotfix branch from base_<env>, which cascade derives from the
      # RECORDED state.<env>.sha, not the env/<env> branch tip. The env/<env>
      # tip is only the PR base. So a real cherry-pick conflict requires the
      # divergence to live in test's recorded base, not on the branch tip.
      # This step drives the divergence into recorded state through cascade:
      #   1. seed a base line on the conflict file and orchestrate it onto dev;
      #   2. promote dev-to-test so base_test (state.test.sha) carries that line;
      #   3. drift the SAME file on trunk WITHOUT promoting test, so trunk moves
      #      past the recorded base;
      #   4. land the trunk fix on the drifted file. Cherry-picking that fix onto
      #      base_test conflicts because base_test still holds the base line, not
      #      the drift the fix was built on.
      # On conflict the apply job emits a warning, opens a PR labeled
      # cascade-hotfix-conflict, and breaks out of the env loop WITHOUT exiting
      # non-zero, so the dispatched run concludes success while the chain is
      # halted by the unmerged labeled PR. The genuine signal is the open
      # cascade-hotfix-conflict PR, so the run is registered expected success.
      # No downstream finalize fires because the conflict PR is left unmerged
      # (chain halted for human resolution). The seed, promote, and drift runs
      # are serialized and settled one at a time so concurrent orchestrate runs
      # never contend on trunk state writes and never get cancelled.
      - name: Step 13 - hotfix cherry-pick conflict
        id: step13
        env:
          GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
        run: |
          set -euo pipefail
          sync_env_state test
          if [ -z "$(state_version test)" ] || [ -z "$(state_sha test)" ]; then
            echo "::error::conflict precondition: state.test version/sha empty"
            exit 1
          fi
          conflict_file="src/hotfix-conflict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

          # 1) Land the recorded-base line on trunk and let orchestrate carry it
          #    onto dev. wait_for_orchestrate_sha returns only when the run (and
          #    its finalize job) is complete, so dev state is on trunk afterward.
          base_sha="$(seed_via_pr "${conflict_file}" \
            "recorded base side of the conflict" \
            "fix: seed recorded base content for hotfix conflict")"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step13-base-orchestrate-run-id"
          base_concl="$(wait_for_orchestrate_sha "${base_sha}")"
          assert_equal "conflict base orchestrate conclusion" "${base_concl}" "success"
          sync_env_state dev

          # 2) Promote dev-to-test so base_test (state.test.sha) carries the
          #    base line. test is not promoted again, so this is the base content
          #    the cherry-pick later fails to apply onto.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step13-promote-run-id"
          gh workflow run promote.yaml -f mode=dev-to-test -f dry_run=false \
            || { echo "::error::failed to dispatch dev-to-test promote"; exit 1; }
          promote_concl="$(wait_for_dispatched_run promote.yaml "${ts}")"
          echo "promote_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "conflict base promote conclusion" "${promote_concl}" "success"
          sync_env_state test

          # 3) Drift the SAME file on trunk so the trunk fix below is built on top
          #    of content that base_test does not carry. test stays at the base
          #    line; trunk moves on.
          drift_sha="$(seed_via_pr "${conflict_file}" \
            "trunk drift ahead of the hotfix fix" \
            "fix: trunk drift ahead of hotfix conflict")"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step13-drift-orchestrate-run-id"
          drift_concl="$(wait_for_orchestrate_sha "${drift_sha}")"
          assert_equal "conflict drift orchestrate conclusion" "${drift_concl}" "success"

          # 4) Land the conflicting trunk fix on the drifted file. Its cherry-pick
          #    pre-image is the drift content, which base_test lacks, so the
          #    cherry-pick onto base_test must conflict.
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step13-seed-orchestrate-run-id"
          fix_sha="$(seed_via_pr "${conflict_file}" \
            "trunk side of the conflict" \
            "fix: trunk patch that conflicts on env/test")"
          fix_concl="$(wait_for_orchestrate_sha "${fix_sha}")"
          echo "seed_orchestrate_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          assert_equal "conflict seed orchestrate conclusion" "${fix_concl}" "success"

          # Normalize env/test to its recorded state.test.sha right before the
          # dispatch so the hotfix preflight finds a clean PR base. env/* are
          # shared across this suite's parallel jobs, so a sibling lane's Step 1
          # seed can leave env/test pointing at a stale tip; cascade's planner
          # fail-closes when env/test has drifted from recorded state. The
          # conflict is still computed from recorded state vs the cherry-picked
          # commit, both untouched by this reset, so the scenario is unchanged.
          # Clear any hotfix PR a crashed prior run stranded so the single-flight
          # gate does not abort this dispatch. Step 13 closes its own conflict PR
          # at the end; this guards the cross-run residue.
          close_open_hotfix_prs

          reset_env_to_recorded test

          # Dispatch the hotfix targeting test; the cherry-pick must conflict.
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RESOLVED_RUN_ID_FILE="${RUNNER_TEMP}/step13-hotfix-run-id"
          gh workflow run cascade-hotfix.yaml \
            -f commit="${fix_sha}" -f target_env=test -f dry_run=false \
            || { echo "::error::failed to dispatch conflicting hotfix"; exit 1; }
          hotfix_concl="$(wait_for_dispatched_run cascade-hotfix.yaml "${ts}")"
          echo "hotfix_conflict_run_id=$(cat "${RESOLVED_RUN_ID_FILE}")" >> "${GITHUB_OUTPUT}"
          # The conflict path opens the labeled PR and breaks the env loop
          # without exiting non-zero, so the run concludes success; the halt is
          # enforced by the unmerged conflict PR asserted below, not by a failed
          # run conclusion.
          assert_equal "conflicting hotfix conclusion" "${hotfix_concl}" "success"

          # A cascade-hotfix-conflict-labeled PR into env/test must exist and be
          # unmerged (the chain halted for human resolution). The apply job opens
          # it as the run completes, so poll a bounded window for it to appear.
          conflict_pr=""
          for _ in $(seq 1 10); do
            conflict_pr="$(gh pr list --base env/test --state open \
              --label cascade-hotfix-conflict \
              --json number --jq 'sort_by(.number) | last | .number' 2>/dev/null || echo "")"
            [ -n "${conflict_pr}" ] && break
            sleep 12
          done
          [ -n "${conflict_pr}" ] \
            || { echo "::error::no cascade-hotfix-conflict PR opened into env/test"; exit 1; }
          echo "conflict resolution PR #${conflict_pr} opened and chain halted"
          # Close the conflict PR so it does not strand an open PR for the next run.
          gh pr close "${conflict_pr}" --delete-branch || true
          summarize "13 hotfix conflict" "PASS" \
            "cherry-pick conflicted; conflict PR opened; chain halted"

      - name: Register Step 13 promote dev-to-test run
        if: steps.step13.outputs.promote_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step13.outputs.promote_run_id }}
          expected-conclusion: success
          reason: step13-promote-dev-to-test
          upload: 'true'

      - name: Register Step 13 seed orchestrate run
        if: steps.step13.outputs.seed_orchestrate_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step13.outputs.seed_orchestrate_run_id }}
          expected-conclusion: success
          reason: step13-seed-orchestrate
          upload: 'true'

      # The conflicting hotfix dispatch concludes success: the apply job opens
      # the cascade-hotfix-conflict PR and breaks the env loop without exiting
      # non-zero. The chain is halted by that unmerged labeled PR (asserted in
      # the step), not by a failed run. Registered expected success so reconcile
      # accounts for it.
      - name: Register Step 13 conflicting hotfix run
        if: steps.step13.outputs.hotfix_conflict_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step13.outputs.hotfix_conflict_run_id }}
          expected-conclusion: success
          reason: step13-hotfix-conflict
          upload: 'true'


  probe_merge_queue:
    name: Probe merge_queue speculative run
    needs: [probe_hotfix_conflict, open-window]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CASCADE_STATE_TOKEN }}
      # Source for the revalidation request, taken from the event payload via
      # env to avoid injecting payload text into shell scripts.
      REVALIDATE_SOURCE: ${{ github.event.client_payload.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.CASCADE_STATE_TOKEN }}

      - name: Setup CLI
        uses: stablekernel/cascade/.github/actions/setup-cli@v0.14.2
        with:
          version: ${{ inputs.cascade_version || 'v0.8.0' }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${REVALIDATE_SOURCE:-}" ]; then
            echo "Revalidation requested by: ${REVALIDATE_SOURCE}"
          fi

      # Shared helpers used by every assertion step. Sourced from $BASH_ENV so the
      # functions are available in later run blocks without re-declaring them.
      - name: Install assertion helpers
        run: |
          set -euo pipefail
          helpers="${RUNNER_TEMP}/helpers.sh"
          cat > "${helpers}" <<'HELPERS'
          # Read a state sub-key for an env from the manifest via the CLI.
          state_sha() {
            cascade status env "$1" --json | jq -r '.state.sha // empty'
          }
          state_version() {
            cascade status env "$1" --json | jq -r '.state.version // empty'
          }
          # Assert a value matches a regex, failing the step on mismatch.
          assert_match() {
            local label="$1" value="$2" pattern="$3"
            if [[ "${value}" =~ ${pattern} ]]; then
              echo "  ok: ${label} (${value}) matches ${pattern}"
            else
              echo "::error::${label} value '${value}' does not match ${pattern}"
              return 1
            fi
          }
          assert_equal() {
            local label="$1" got="$2" want="$3"
            if [[ "${got}" == "${want}" ]]; then
              echo "  ok: ${label} == ${want}"
            else
              echo "::error::${label} expected '${want}' got '${got}'"
              return 1
            fi
          }
          # Look up a release by tag and print its draft/prerelease/latest flags.
          release_flag() {
            gh release view "$1" --json "$2" --jq ".$2" 2>/dev/null || echo "missing"
          }
          # Snapshot all four env states plus tags and releases into one string so
          # dry-run steps can compare before and after.
          full_snapshot() {
            for e in dev test staging prod; do
              printf 'env:%s sha:%s ver:%s\n' "${e}" "$(state_sha "${e}")" "$(state_version "${e}")"
            done
            echo "tags:"
            git tag --sort=-creatordate
            echo "releases:"
            gh release list --json tagName,isDraft,isPrerelease,isLatest \
              --jq '.[] | "\(.tagName) draft=\(.isDraft) pre=\(.isPrerelease) latest=\(.isLatest)"' \
              | sort
          }
          # Bounded wait for a workflow_dispatch run that THIS suite triggered.
          # workflow_dispatch carries no merge commit to key on, so callers
          # capture a UTC timestamp immediately before `gh workflow run` and
          # pass it here. The run created at/after that timestamp is the one we
          # fired; we capture its databaseId and poll THAT exact run to
          # completion rather than grabbing the global newest run, which a
          # stale or concurrent dispatch could otherwise win. Prints the run
          # conclusion on success.
          wait_for_dispatched_run() {
            local wf="$1" since="$2" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              if [ -z "${run_id}" ]; then
                run_id="$(gh run list --workflow "${wf}" --created ">=${since}" \
                  --json databaseId,headBranch,status \
                  --jq '.[0].databaseId // empty')"
                # Expose the resolved run id to the caller (write once) so the
                # following register-run step can record it in the reconcile
                # ledger. Side channel only; stdout still carries the conclusion.
                if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ]; then
                  echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
                fi
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for dispatched ${wf} run since ${since}"
            return 1
          }
          # Wait for the orchestrate run fired by a specific merge commit on main,
          # keyed on headSha so a stale or concurrent run is never mistaken for
          # this one. Prints the run conclusion on success.
          wait_for_orchestrate_sha() {
            local merge_sha="$1" attempts=15 i=0 run_id="" status conclusion
            while [ "${i}" -lt "${attempts}" ]; do
              run_id="$(gh run list --workflow orchestrate.yaml --branch main \
                --json databaseId,headSha,status \
                --jq ".[] | select(.headSha==\"${merge_sha}\") | .databaseId" \
                | head -n1)"
              # Expose the resolved orchestrate run id to the caller (write once)
              # so the following register-run step can record it in the reconcile
              # ledger. Side channel only; stdout still carries the conclusion.
              if [ -n "${run_id}" ] && [ -n "${RESOLVED_RUN_ID_FILE:-}" ] \
                && [ ! -s "${RESOLVED_RUN_ID_FILE}" ]; then
                echo "${run_id}" > "${RESOLVED_RUN_ID_FILE}"
              fi
              if [ -n "${run_id}" ]; then
                status="$(gh run view "${run_id}" --json status --jq '.status // "none"')"
                if [ "${status}" = "completed" ]; then
                  conclusion="$(gh run view "${run_id}" \
                    --json conclusion --jq '.conclusion // "none"')"
                  echo "${conclusion}"
                  return 0
                fi
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for orchestrate run for ${merge_sha}"
            return 1
          }
          # Land a src/** change on main through a branch -> PR -> rebase-merge.
          # Rebase replays the branch commit onto main and preserves its
          # github-actions[bot] author. The commit message carries the
          # conventional type. Prints the merge commit SHA on origin/main.
          seed_via_pr() {
            local file="$1" content="$2" title="$3" branch sha
            branch="scenario/src-$(date +%s)-${RANDOM}"
            # Route all command chatter to stderr so the function's stdout is
            # ONLY the merge SHA (callers capture it via command substitution).
            {
              git fetch origin main --quiet
              git checkout -B "${branch}" origin/main
              mkdir -p src
              printf '%s\n' "${content}" > "${file}"
              git add "${file}"
              git commit --no-gpg-sign -s -m "${title}"
              git push origin "${branch}"
              gh pr create --base main --head "${branch}" \
                --title "${title}" \
                --body "Automated scenario run; drives orchestrate on merge."
              gh pr merge "${branch}" --rebase --delete-branch
              git fetch origin main --quiet
            } >&2
            sha="$(git rev-parse origin/main)"
            printf '%s\n' "${sha}"
          }
          # Refresh local trunk and poll until the named env carries a version.
          # cascade's finalize job pushes the "update state" commit to main a
          # few seconds after the orchestrate/promote run reports success, so a
          # single fetch+reset can read the pre-state-commit manifest. Re-fetch
          # trunk and re-read until the env is populated (up to ~60s).
          sync_env_state() {
            local env="$1" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_version "${env}")" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} state to land on trunk"
            return 1
          }
          # Like sync_env_state, but poll until the env's sha differs from a
          # known prior value. A rollback re-writes an env that ALREADY carries
          # a version, so a plain non-empty poll returns the stale pre-rollback
          # state immediately. Pass the pre-rollback sha and wait for the
          # finalize state commit that actually changes it.
          sync_env_state_until_sha_changed() {
            local env="$1" prior_sha="$2" i=0
            while [ "${i}" -lt 2 ]; do
              git fetch origin main --quiet
              git reset --hard origin/main >/dev/null
              if [ -n "$(state_sha "${env}")" ] && [ "$(state_sha "${env}")" != "${prior_sha}" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 60
            done
            echo "::error::timed out waiting for ${env} sha to change from ${prior_sha} on trunk"
            return 1
          }
          # Read the divergence ref an env carries (set to rollback/<env> after a
          # manual rollback, empty on the linear promotion line).
          state_ref() {
            cascade status env "$1" --json | jq -r '.state.ref // empty'
          }
          # Force the remote env/<env> branch tip back to that env's OWN recorded
          # state.<env>.sha. cascade's contract is that env/<env> tip always
          # equals recorded state, and the hotfix planner derives its cherry-pick
          # base from recorded state and fail-closes when a live env tip has
          # drifted. This repo's env/* branches are shared across the suite's
          # parallel jobs, so a sibling job's seed can leave a stale tip behind;
          # resetting to the recorded SHA clears that residue deterministically
          # WITHOUT recreating any divergence. Requires GH_TOKEN (admin PAT) in
          # the step env to bypass branch protection. In-suite git only, no GPG.
          reset_env_to_recorded() {
            local env="$1" e_sha push_remote
            git fetch origin main --quiet
            e_sha="$(state_sha "${env}")"
            [ -n "${e_sha}" ] \
              || { echo "::error::cannot reset env/${env}: recorded state SHA empty"; return 1; }
            push_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force "${push_remote}" "${e_sha}:refs/heads/env/${env}" \
              || { echo "::error::failed to reset env/${env} to recorded state"; return 1; }
          }
          # Close any open cascade-hotfix / cascade-hotfix-conflict PR before a
          # hotfix stage dispatches. The generated plan job passes --repo, which
          # arms the single-flight gate: it aborts a fresh hotfix while an open
          # hotfix PR already targets the env. A prior run that ended mid-hotfix
          # can strand such a PR, so close each one and drop its head branch to
          # normalize state. Scoped to the two hotfix labels; other open PRs are
          # left untouched.
          close_open_hotfix_prs() {
            local label num
            for label in cascade-hotfix cascade-hotfix-conflict; do
              for num in $(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
                --label "${label}" --json number --jq '.[].number' 2>/dev/null || true); do
                gh pr close "${num}" --repo "${GITHUB_REPOSITORY}" --delete-branch \
                  && echo "closed stale ${label} PR #${num}" \
                  || echo "::warning::could not close ${label} PR #${num}"
              done
            done
          }
          # Append a PASS/FAIL row to the job summary table.
          summarize() {
            printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "${GITHUB_STEP_SUMMARY}"
          }
          _gh_is_transient() {
            local out="$1"
            if printf '%s' "$out" | grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|HTTP 401|Bad credentials|was submitted too quickly|secondary rate limit'; then
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'HTTP 403'; then
              if printf '%s' "$out" | grep -qiE 'rate limit|secondary|abuse|too quickly'; then
                return 0
              fi
            fi
            return 1
          }
          gh() {
            local attempt=1 max="${GH_RETRY_MAX:-5}" delay="${GH_RETRY_BASE_DELAY:-3}" out rc
            while :; do
              out="$(command gh "$@" 2>&1)" && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" -ge "$max" ] || ! _gh_is_transient "$out"; then
                if [ "$attempt" -gt 1 ]; then
                  printf 'gh: giving up after %d attempts (exit %d)\n' "$attempt" "$rc" >&2
                fi
                printf '%s\n' "$out" >&2
                return "$rc"
              fi
              printf 'gh: transient error on attempt %d/%d, retrying in %ds\n%s\n' "$attempt" "$max" "$delay" "$out" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          HELPERS
          echo "BASH_ENV=${helpers}" >> "${GITHUB_ENV}"
          {
            echo "## scenario-suite results"
            echo ""
            echo "| step | result | detail |"
            echo "| --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"


      # ===================================================================
      # Step 14 - merge_queue speculative validation (#319)
      # cascade-merge-queue.yaml runs on merge_group only - it cannot be
      # dispatched. Driving a real merge_group event needs the repo's merge
      # queue enabled and a PR added to the queue, which the suite cannot
      # synthesize deterministically across fleet runs without a configured
      # queue. When a merge_group run is present in the scenario window it MUST
      # conclude success (parse-config + dry-run orchestrate preview, no state
      # write); resolve and register it when one is found, and assert it wrote
      # no state. If no merge_group run is present this step is a no-op (the
      # gen-time merge-queue assertion still covers the lane's shape), and the
      # limitation is noted in the PR body rather than faked.
      - name: Step 14 - merge_queue speculative run (if present)
        id: step14
        run: |
          set -euo pipefail
          for e in dev test staging prod; do sync_env_state "${e}"; done
          before_dev_sha="$(state_sha dev)"
          # Look for a merge_group run in this scenario window. window-start was
          # captured before any dispatch, so any present run is in-window.
          mq_id="$(gh run list --workflow cascade-merge-queue.yaml \
            --event merge_group \
            --created ">=${{ needs.open-window.outputs.window-start }}" \
            --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || echo "")"
          if [ -z "${mq_id}" ]; then
            echo "::notice::no merge_group run in window; merge-queue lane covered by gen-time shape assertion"
            summarize "14 merge_queue" "SKIP" "no merge_group event in window (needs configured queue)"
            exit 0
          fi
          for _ in $(seq 1 10); do
            st="$(gh run view "${mq_id}" --json status --jq '.status // "none"')"
            [ "${st}" = "completed" ] && break
            sleep 30
          done
          mq_concl="$(gh run view "${mq_id}" --json conclusion --jq '.conclusion // "none"')"
          echo "merge_queue_run_id=${mq_id}" >> "${GITHUB_OUTPUT}"
          assert_equal "merge_queue conclusion" "${mq_concl}" "success"
          git fetch origin main --quiet
          git reset --hard origin/main >/dev/null
          assert_equal "merge_queue wrote no state" "$(state_sha dev)" "${before_dev_sha}"
          summarize "14 merge_queue" "PASS" "merge_group run passed and wrote no state"

      - name: Register Step 14 merge_queue speculative run
        if: steps.step14.outputs.merge_queue_run_id != ''
        uses: stablekernel/cascade/.github/actions/register-run@main
        with:
          run-id: ${{ steps.step14.outputs.merge_queue_run_id }}
          expected-conclusion: success
          reason: step14-merge-queue-speculative
          upload: 'true'


  gen-time-checks:
    name: gen-time checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: assert optional_depends_on order
        shell: bash
        run: |
          set -euo pipefail
          assert_eq() {
            local label="$1" actual="$2" expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::FAIL $label: expected '$expected' got '$actual'"
              exit 1
            fi
            echo "PASS $label"
          }

          # build-docs.needs must contain build-app (it is [setup, build-app])
          NEEDS=$(yq -o=json -I=0 '.jobs."build-docs".needs' .github/workflows/orchestrate.yaml)
          assert_eq "build-docs.needs contains build-app" "$(echo "$NEEDS" | yq 'contains(["build-app"])' -)" "true"

          # build-docs.if must equal the exact setup condition (no build-app.result in gate)
          BUILD_DOCS_IF=$(yq '.jobs."build-docs".if' .github/workflows/orchestrate.yaml)
          assert_eq "build-docs.if" "$BUILD_DOCS_IF" "needs.setup.outputs.run_build_docs == 'true'"

          # build-docs.if must NOT contain build-app.result
          if echo "$BUILD_DOCS_IF" | grep -q "build-app.result"; then
            echo "::error::FAIL build-docs.if must not contain build-app.result, got: $BUILD_DOCS_IF"
            exit 1
          fi
          echo "PASS build-docs.if does not gate on build-app.result"

      - name: assert retry shims
        shell: bash
        run: |
          set -euo pipefail
          assert_eq() {
            local label="$1" actual="$2" expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::FAIL $label: expected '$expected' got '$actual'"
              exit 1
            fi
            echo "PASS $label"
          }

          RETRY1_IF=$(yq '.jobs."build-app-retry-1".if' .github/workflows/orchestrate.yaml)
          assert_eq "build-app-retry-1.if" "$RETRY1_IF" "needs.build-app.result == 'failure'"

          RETRY1_NEEDS=$(yq -o=json -I=0 '.jobs."build-app-retry-1".needs' .github/workflows/orchestrate.yaml)
          assert_eq "build-app-retry-1.needs" "$RETRY1_NEEDS" '["setup","build-app"]'

          RETRY2_IF=$(yq '.jobs."build-app-retry-2".if' .github/workflows/orchestrate.yaml)
          assert_eq "build-app-retry-2.if" "$RETRY2_IF" "needs.build-app-retry-1.result == 'failure'"

          RETRY2_NEEDS=$(yq -o=json -I=0 '.jobs."build-app-retry-2".needs' .github/workflows/orchestrate.yaml)
          assert_eq "build-app-retry-2.needs" "$RETRY2_NEEDS" '["setup","build-app-retry-1"]'

      - name: assert merge-queue behavior
        shell: bash
        run: |
          set -euo pipefail
          assert_eq() {
            local label="$1" actual="$2" expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::FAIL $label: expected '$expected' got '$actual'"
              exit 1
            fi
            echo "PASS $label"
          }

          # file exists
          [ -f .github/workflows/cascade-merge-queue.yaml ] || { echo "::error::cascade-merge-queue.yaml not found"; exit 1; }
          echo "PASS cascade-merge-queue.yaml exists"

          HAS_MG=$(yq '.on | has("merge_group")' .github/workflows/cascade-merge-queue.yaml)
          assert_eq "merge_group trigger" "$HAS_MG" "true"

          JOB_KEYS=$(yq -o=json -I=0 '.jobs | keys' .github/workflows/cascade-merge-queue.yaml)
          assert_eq "merge-queue job key" "$JOB_KEYS" '["merge-queue-validate"]'

          grep -q "cascade parse-config" .github/workflows/cascade-merge-queue.yaml || { echo "::error::cascade parse-config not found in merge-queue yaml"; exit 1; }
          echo "PASS cascade parse-config present"

          grep -q "cascade --dry-run orchestrate setup" .github/workflows/cascade-merge-queue.yaml || { echo "::error::cascade --dry-run orchestrate setup not found in merge-queue yaml"; exit 1; }
          echo "PASS cascade --dry-run orchestrate setup present"

  # Reconcile gate: the structural coverage backstop. Each probe job's asserts
  # still gate the runs it waits on; this job is additive. It enumerates EVERY
  # run this repo produced since window-start (captured by open-window before
  # any dispatch) and fails closed if any is unaccounted for in the merged
  # ledger: an unregistered non-success run, or a registered run that concluded
  # other than its expected conclusion. needs lists every run-causing job so the
  # ledger aggregates across all of them; if: always() runs it even when a probe
  # failed, so the full window is always enumerated.
  reconcile:
    name: Reconcile scenario-window runs
    needs: [open-window, repin, lifecycle, probe_drift, probe_validate, probe_rollback, probe_concurrency, probe_hotfix_conflict, probe_merge_queue]
    if: always()
    uses: stablekernel/cascade/.github/workflows/fleet-reconcile.yaml@main
    permissions:
      contents: read
      actions: read
    with:
      window-start: ${{ needs.open-window.outputs.window-start }}
      # Artifact mode: every register-run step uploaded a per-job ledger under
      # the default cascade-run-ledger-* name; reconcile globs and merges them.
      cascade-ref: main
